<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XKAgent Web</title>
<style>
  :root {
    --bg: #f3f5fb;
    --surface: #ffffff;
    --surface2: #f6f6f6;
    --surface3: #eef1f6;
    --text: #1c1f23;
    --text-muted: #57606a;
    --accent: #0066ff;
    --accent-hover: #0052cc;
    --accent-soft: rgba(0, 102, 255, 0.09);
    --warn: #d97706;
    --err: #dc2626;
    --border: rgba(28, 31, 35, 0.08);
    --radius: 12px;
    --tool-bg: #ffffff;
    --thinking-bg: #f6f8fa;
    --thinking-pre-bg: rgba(28, 31, 35, 0.06);
    --on-accent: #ffffff;
    --code-bg: #f6f8fa;
    --link: #0066ff;
    --sidebar-w: 320px;
  }
  html[data-theme="dark"] {
    --bg: #16161a;
    --surface: #232429;
    --surface2: #2e2f35;
    --surface3: #35363c;
    --text: rgba(249, 249, 249, 0.9);
    --text-muted: rgba(249, 249, 249, 0.6);
    --accent: #3295fb;
    --accent-hover: #5aa2fb;
    --accent-soft: rgba(50, 149, 251, 0.15);
    --warn: #ffc234;
    --err: #ff4f42;
    --border: rgba(255, 255, 255, 0.08);
    --tool-bg: #232429;
    --thinking-bg: #1e1f24;
    --thinking-pre-bg: rgba(255, 255, 255, 0.06);
    --on-accent: #ffffff;
    --code-bg: #1d1e22;
    --link: #77b0ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: row; overflow: hidden;
  }
  /* ── 左侧边栏（常驻，可折叠）── */
  #sidebar {
    width: var(--sidebar-w); flex-shrink: 0; position: relative;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    height: 100vh; overflow-y: auto;
    transition: margin-left .25s ease, width .25s ease;
    z-index: 50;
  }
  body.sidebar-collapsed #sidebar { margin-left: calc(-1 * var(--sidebar-w)); }
  /* 2026-09-11: 侧边栏宽度拖拽把手（拖动调宽；双击恢复默认；移动端隐藏） */
  #sidebar-resizer {
    /* fixed：脱离 #sidebar 滚动容器——侧栏内容超长滚动时把手不错位（2026-09-11 review 修复） */
    position: fixed; top: 0; left: calc(var(--sidebar-w) - 3px); width: 7px; height: 100vh;
    cursor: col-resize; z-index: 60; background: transparent;
    touch-action: none;   /* 触摸设备：拖拽把手时阻止页面滚动（桌面无影响） */
  }
  body.sidebar-collapsed #sidebar-resizer { display: none; }
  #sidebar-resizer:hover, #sidebar-resizer.dragging { background: rgba(74,158,255,.35); }
  body.sidebar-resizing #sidebar { transition: margin-left .25s ease, width 0s; }
  body.sidebar-resizing { cursor: col-resize; user-select: none; }
  @media (max-width: 768px) { #sidebar-resizer { display: none; } }
  .sidebar-header {
    padding: 14px 16px; display: flex; align-items: center; gap: 8px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-header h1 { font-size: 16px; color: var(--accent); font-weight: 600; flex: 1; white-space: nowrap; }
  #btn-sidebar-toggle, #btn-hamburger {
    border: none; background: transparent; color: var(--text-muted);
    cursor: pointer; font-size: 14px; padding: 4px 8px; border-radius: 8px;
    transition: background .15s, color .15s;
  }
  #btn-sidebar-toggle:hover, #btn-hamburger:hover { background: var(--surface2); color: var(--text); }
  .sidebar-status {
    padding: 10px 16px; font-size: 12px; color: var(--text-muted);
    display: flex; flex-direction: column; gap: 4px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-status #token-stats { margin-left: 0; }
  #session-label { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  #session-name { font-size: 16px; font-weight: 600; color: var(--text); word-break: break-all; }
  /* 2026-09-10: 当前会话标题（title）编辑框——纯展示属性，不影响 session name / 磁盘路径 */
  .session-title-row { display: flex; align-items: center; gap: 6px; }
  .session-title-row input {
    flex: 1; min-width: 0; padding: 4px 8px; font-size: 12px;
    color: var(--text); background: var(--surface2); border: 1px dashed var(--border);
    border-radius: 8px; outline: none;
  }
  .session-title-row input:focus { border-style: solid; border-color: var(--accent); }
  .session-title-row input::placeholder { color: var(--text-muted, #888); }
  .session-title-row input:disabled { opacity: .5; }
  .provider-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
  #provider-model-select {
    flex: 1; min-width: 0; font-size: 11px; color: var(--text);
    background: var(--surface2, #2a2a2a); border: 1px solid var(--border, #444);
    border-radius: 4px; padding: 2px 4px; cursor: pointer;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #btn-ping { background: none; border: none; cursor: pointer; font-size: 12px; padding: 0 2px; color: var(--accent, #4a9eff); flex-shrink: 0; }
  #btn-ping:hover { opacity: 0.7; }
  /* ── 模型测试弹窗 ── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center; }
  .modal-box { background: var(--bg, #1e1e1e); border: 1px solid var(--border, #444); border-radius: 8px; max-width: 720px; width: 90%; max-height: 80vh; display: flex; flex-direction: column; }
  .modal-head { padding: 12px 16px; border-bottom: 1px solid var(--border, #444); display: flex; justify-content: space-between; align-items: center; }
  .modal-title { font-weight: bold; }
  .modal-close { cursor: pointer; background: none; border: none; font-size: 16px; color: var(--text-muted, #888); }
  .modal-body { padding: 12px 16px; overflow-y: auto; }
  .model-test-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .model-test-table th, .model-test-table td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--border, #333); }
  .model-test-table th { color: var(--text-muted, #888); font-weight: normal; }
  .mt-ok { color: #4caf50; } .mt-fail { color: #f44336; }
  .mt-set-btn { font-size: 11px; padding: 2px 8px; margin: 0 4px; cursor: pointer; border: 1px solid var(--border, #555); border-radius: 4px; background: var(--bg2, #2a2a2a); color: inherit; }
  .mt-set-btn:hover { border-color: var(--accent, #4a9eff); }
  /* 消息耗时提示 */
  .msg-latency { font-size: 11px; color: var(--text-muted, #888); margin-left: 8px; }
  .session-input-row {
    padding: 10px 12px; display: flex; gap: 6px; flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }
  .session-input-row input {
    flex: 1; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface2); color: var(--text); font-size: 12px; outline: none;
  }
  .session-input-row input:focus { border-color: var(--accent); }
  .session-input-row #new-session-workdir { flex-basis: 100%; }
  /* 2026-09-07: subagent 显示开关（默认关闭） */
  .session-subagent-row { padding: 6px 12px 0; font-size: 12px; }
  .session-subagent-row .subagent-toggle { display: flex; align-items: center; gap: 6px;
    cursor: pointer; color: var(--text-muted); padding-bottom: 6px; }

  .session-input-row button {
    padding: 6px 12px; background: var(--accent); border: none; border-radius: 8px;
    color: #fff; cursor: pointer; font-size: 14px;
  }
  .session-input-row button:hover { background: var(--accent-hover); }
  #session-list { flex: 1; overflow-y: auto; padding: 8px; }
  .session-item {
    padding: 8px 10px; cursor: pointer; border-radius: 8px; margin: 2px 0; font-size: 13px;
    display: flex; align-items: center; gap: 4px;
  }
  .session-item > .session-name-text { flex: 1; word-break: break-all; }
  .session-item > .session-name-sub { font-size: 11px; color: var(--text-muted, #888);
    flex-shrink: 0; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-item:hover { background: var(--surface2); }
  .session-item.active { background: var(--accent-soft); border-left: 3px solid var(--accent); }
  .session-stop {
    display: none; border: none; background: transparent; color: var(--text-muted);
    cursor: pointer; font-size: 12px; padding: 2px 4px; border-radius: 4px;
    flex-shrink: 0;
  }
  .session-stop:hover { color: #f59e0b; background: rgba(245,158,11,.1); }
  .session-interrupt {
    display: none; margin-left: 4px; padding: 0 4px; border: none; border-radius: 4px;
    background: transparent; color: var(--text-muted,#888); cursor: pointer; font-size: 11px;
  }
  .session-interrupt:hover { color: #ef4444; background: rgba(239,68,68,.1); }
  .session-fork {
    display: none; border: none; background: transparent; color: var(--text-muted);
    cursor: pointer; font-size: 12px; padding: 2px 4px; border-radius: 4px;
    flex-shrink: 0;
  }
  .session-fork:hover { color: var(--accent); background: rgba(99,102,241,.12); }
  .session-item:hover .session-fork { display: inline-block; }
  /* 2026-09-10: 置顶按钮（hover 可见；已置顶常显琥珀色，点击切换） */
  .session-pin {
    display: none; border: none; background: transparent; color: var(--text-muted);
    cursor: pointer; font-size: 12px; padding: 2px 4px; border-radius: 4px;
    flex-shrink: 0;
  }
  .session-pin:hover { color: #f59e0b; background: rgba(245,158,11,.12); }
  .session-pin.pinned { display: inline-block; color: #f59e0b; }
  .session-item:hover .session-pin { display: inline-block; }
  .session-item:hover .session-stop { display: inline-block; }
  .session-item:hover .session-interrupt { display: inline-block; }
  .session-mode-tag { font-size: 11px; color: var(--muted, #888); margin-left: 6px; }
  .session-lock-tag { font-size: 11px; color: #f59e0b; font-weight: bold; }
  .session-divider { margin: 10px 0 4px; padding-top: 8px; border-top: 1px solid var(--border); font-size: 11px; color: var(--muted, #888); text-transform: uppercase; letter-spacing: .05em; }
  .session-status-dot { font-size: 10px; color: #22c55e; margin-right: 4px; }
  .session-phase-tag { font-size: 11px; color: var(--accent); margin-left: 6px; font-weight: bold; }
  .session-pending-tag { font-size: 11px; color: #f59e0b; margin-left: 6px; font-weight: bold; }
  .session-empty { font-size: 12px; color: var(--muted, #888); padding: 8px 10px; text-align: center; }

  /* ── 主区域 ── */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100vh; }
  #btn-hamburger { display: none; position: fixed; top: 8px; left: 8px; z-index: 60; font-size: 18px; background: var(--surface); border: 1px solid var(--border); box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  body.sidebar-collapsed #btn-hamburger { display: block; }
  #chat {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 8px;
    width: 100%; max-width: 768px; margin: 0 auto;
  }
  #chat > * { flex-shrink: 0; }   /* F2: 防 flex 压缩子元素导致 scrollHeight 失真 */
  .msg { max-width: 85%; padding: 8px 12px; border-radius: var(--radius); line-height: 1.5; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .msg.user {
    align-self: flex-end; background: var(--accent-soft); color: var(--text);
    border-top-right-radius: 4px; scroll-margin-top: 12px;
  }
  .msg.assistant { align-self: flex-start; background: transparent; }
  .msg.assistant .msg-head { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .msg.assistant .view-toggle { font-size: 10px; padding: 1px 8px; border: 1px solid var(--border); border-radius: 10px; background: transparent; color: var(--text-muted); cursor: pointer; opacity: 0.7; }
  .msg.assistant .view-toggle:hover { opacity: 1; }
  .msg.assistant .md-body { white-space: normal; }
  .msg.assistant .md-body pre { background: var(--code-bg); padding: 10px 12px; border-radius: 8px; overflow-x: auto; font-size: 12.5px; line-height: 1.45; border: 1px solid var(--border); }
  .msg.assistant .md-body code { background: var(--code-bg); padding: 1px 5px; border-radius: 3px; font-size: 12.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .msg.assistant .md-body pre code { background: none; padding: 0; border: none; }
  /* 2026-08-28: Mermaid 图容器样式 + 加载占位（加载期间遮罩原文，渲染后移除） */
  .msg.assistant .md-body pre.mermaid { background: transparent; border: 1px dashed var(--border); text-align: center; padding: 12px 8px; }
  .msg.assistant .md-body pre.mermaid.mermaid-loading { position: relative; color: transparent; }
  .msg.assistant .md-body pre.mermaid.mermaid-loading::after { content: '⏳ 渲染图表中…'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--text-muted); }
  .msg.assistant .md-body h1, .msg.assistant .md-body h2, .msg.assistant .md-body h3 { margin: 10px 0 6px; line-height: 1.3; }
  .msg.assistant .md-body h1 { font-size: 17px; }
  .msg.assistant .md-body h2 { font-size: 15.5px; }
  .msg.assistant .md-body h3 { font-size: 14px; }
  .msg.assistant .md-body p { margin: 4px 0; }
  .msg.assistant .md-body ul, .msg.assistant .md-body ol { margin: 4px 0; padding-left: 20px; }
  .msg.assistant .md-body blockquote { margin: 6px 0; padding: 2px 12px; border-left: 3px solid var(--accent); color: var(--text-muted); }
  .msg.assistant .md-body a { color: var(--link); }
  .msg.assistant .md-body a.file-link { text-decoration: underline; cursor: pointer; }
  .msg.assistant .md-body table { border-collapse: collapse; margin: 6px 0; font-size: 13px; }
  .msg.assistant .md-body th, .msg.assistant .md-body td { border: 1px solid var(--border); padding: 4px 10px; }
  .msg.assistant .md-body th { background: var(--surface2); }
  .msg.assistant .md-body hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
.msg.assistant .md-body img.md-img { max-width: 100%; max-height: 420px; border-radius: 8px; border: 1px solid var(--border); margin: 6px 0; cursor: zoom-in; vertical-align: middle; }
.msg.assistant .md-body img.md-img-linkify { max-height: 160px; max-width: 220px; border-radius: 8px; border: 1px solid var(--border); margin: 4px 6px 4px 0; cursor: zoom-in; vertical-align: middle; }
/* 2026-09-09: 图片加载失败 → 文件名占位（替代裂图） */
.md-img-missing { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; padding: 4px 10px; margin: 4px 6px 4px 0; border: 1px dashed var(--border); border-radius: 8px; color: var(--text-muted); background: var(--surface3); font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; cursor: pointer; word-break: break-all; vertical-align: middle; }
.md-img-missing:hover { border-color: var(--accent); color: var(--accent); }
  .msg.assistant .code-body { white-space: pre-wrap; word-break: break-word; }
  .msg.tool {
    align-self: flex-start; background: var(--tool-bg); font-size: 12px; color: var(--text-muted);
    border: 1px solid var(--border);
  }
  .msg.system { align-self: flex-start; background: transparent; font-size: 12px; color: var(--text-muted); text-align: left; }   /* 2026-08-07: 统一左对齐（历史+实时） */
  .msg.error { align-self: center; background: var(--err); color: #fff; font-size: 12px; }
  .msg .msg-meta { font-size: 11px; opacity: 0.7; margin-bottom: 4px; }
  .msg-meta-outside {
    align-self: flex-end;
    font-size: 11px;
    color: var(--text-muted);
    opacity: 0.7;
    margin-bottom: 2px;
    padding: 0 4px;
  }
  /* 2026-08-28: 按消息 fork 按钮（hover meta 行显示） */
  .msg-meta-outside .msg-fork,
  .msg-meta-outside .msg-rerun {
    display: none; margin-left: 6px; border: none; background: transparent;
    color: var(--text-muted); cursor: pointer; font-size: 11px; padding: 0 2px;
  }
  .msg-meta-outside:hover .msg-fork,
  .msg-meta-outside:hover .msg-rerun { display: inline-block; }
  .msg-meta-outside .msg-fork:hover,
  .msg-meta-outside .msg-rerun:hover { color: var(--accent); }
  .msg details { cursor: pointer; }
  .msg details summary { font-weight: bold; }
  .msg.tool details pre {
    margin-top: 6px; font-size: 11px; white-space: pre-wrap; word-break: break-all;
    color: var(--text-muted); max-height: 200px; overflow-y: auto;
  }
  .msg details[open] summary { margin-bottom: 4px; }
  /* 2026-08-11: 工具参数 markdown 渲染——不截断（覆盖 .msg.tool details pre 的 max-height） */
  .msg.tool .tool-args-md { margin-top: 6px; font-size: 12px; }
  .msg.tool .tool-args-md pre { max-height: none; overflow: visible; }
  .msg.tool .tool-args-md code { white-space: pre-wrap; word-break: break-word; }
  .msg.thinking-box {
    align-self: flex-start; background: var(--thinking-bg); max-width: 85%;
    padding: 6px 12px; border-radius: var(--radius); border: 1px solid var(--border);
  }
  .msg.thinking-box summary { font-size: 12px; color: var(--text-muted); cursor: pointer; font-weight: bold; }
  .msg.thinking-box pre.thinking-content {
    margin-top: 6px; font-size: 11px; white-space: pre-wrap; word-break: break-all;
    color: var(--text-muted); max-height: 200px; overflow-y: auto;
    background: var(--thinking-pre-bg); padding: 6px 8px; border-radius: 4px;
  }
  .tool-call-info { font-size: 11px; color: var(--warn); }
  .thinking { align-self: flex-start; color: var(--text-muted); font-size: 12px; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
  .status-indicator {
    display: inline-block; padding: 5px 14px; border-radius: 9999px;
    font-size: 11px; font-weight: 600;
    background: var(--surface2); color: var(--text-muted);
    border: 1px solid var(--border); user-select: none;
    white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis;
    transition: background .15s, color .15s, border-color .15s;
  }
  .status-indicator.clickable { cursor: pointer; }
  .status-indicator.clickable:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .status-indicator.mode-indicator { min-width: 96px; text-align: center; }
  .status-indicator.lock-indicator { display: none; }
  .status-indicator.autocompact-indicator { display: none; font-size: 11px; }
  .status-indicator.autocompact-indicator.has-value { display: inline-block; color: var(--muted, #888); }
  /* 2026-09-02: 压缩 marker 提示块（上下虚线横线；总结默认收起防重复刷屏） */
  .msg.compact-block {
    max-width: 92%; background: transparent; border-radius: 0;
    border-top: 1.5px dashed var(--muted, #999);
    border-bottom: 1.5px dashed var(--muted, #999);
    padding: 6px 12px; margin: 8px auto; opacity: 0.92;
  }
  .msg.compact-block .compact-head {
    text-align: center; font-size: 12px; color: var(--muted, #888);
    cursor: pointer; user-select: none;
  }
  .msg.compact-block .compact-body {
    font-size: 12.5px; color: var(--text-muted, #777); white-space: pre-wrap;
    text-align: left; max-height: 300px; overflow-y: auto; margin-top: 6px;
  }
  .msg.compact-block.collapsed .compact-body { display: none; }
  .status-indicator.lock-indicator.has-lock { display: inline-block; background: rgba(245,158,11,.15); color: #b45309; }
  .status-indicator.lock-indicator.has-lock:hover { background: #b45309; color: #fff; }

  /* ── 底部输入区 + 工具条 ── */
  .input-area {
    padding: 12px 24px 16px; background: var(--surface); border-top: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 8px;
    width: 100%; max-width: 768px; margin: 0 auto;
  }
  .input-row { display: flex; gap: 8px; align-items: flex-end; }
  .input-area textarea {
    flex: 1; padding: 12px 16px; border: 1px solid var(--border); border-radius: 24px;
    background: var(--surface2); color: var(--text); font-family: inherit; font-size: 14px;
    resize: none; min-height: 44px; max-height: 120px;
    transition: border-color .15s;
  }
  .input-area textarea:focus { outline: none; border-color: var(--accent); }
  .input-area .send-btn {
    padding: 10px 22px; border: none; border-radius: 9999px;
    background: var(--accent); color: #fff; cursor: pointer; font-weight: 500;
    transition: background .15s; height: 44px; align-self: flex-end;
  }
  .input-area .send-btn:hover { background: var(--accent-hover); }
  .input-area .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .input-area textarea:disabled { opacity: 0.55; cursor: not-allowed; }
  /* 2026-08-30(v1.2): 排队消息列表（busy 时发送 → 会话级 FIFO 队列；排队期间不渲染为消息气泡，
     统一显示在输入框上方队列条；回合结束自动续跑，开始处理（chat_dequeued）时才渲染为真实用户消息） */
  .queue-bar { display: flex; flex-direction: column; gap: 6px; padding: 8px 10px;
    border-radius: 10px; background: rgba(245,158,11,.12); color: var(--warn); font-size: 12px;
    max-height: 180px; overflow-y: auto; }
  .queue-bar[hidden] { display: none; }
  .queue-bar-row { display: flex; align-items: center; gap: 8px; }
  #queue-bar-text { flex: 1; min-width: 0; }
  .queue-bar button { padding: 2px 10px; border: 1px solid currentColor; border-radius: 9999px;
    background: transparent; color: inherit; cursor: pointer; font-size: 12px; flex-shrink: 0; }
  .queue-items { display: flex; flex-direction: column; gap: 4px; }
  .queue-item { display: flex; align-items: center; gap: 6px; padding: 3px 8px;
    border-radius: 8px; background: var(--surface); border: 1px solid var(--border); min-width: 0; }
  .queue-item-pos { flex-shrink: 0; font-size: 11px; font-weight: 600; color: var(--warn); }
  .queue-item-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; color: var(--text); }
  .queue-item-cancel { flex-shrink: 0; width: 20px; height: 20px; padding: 0; border: none;
    border-radius: 9999px; background: transparent; color: var(--warn); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; font-size: 11px; opacity: .7; }
  .queue-item-cancel:hover { opacity: 1; background: rgba(245,158,11,.15); }
  .status-indicator.disabled { opacity: 0.45; pointer-events: none; }
  .input-area .upload-btn {
    padding: 10px 14px; border: 1px solid var(--border); border-radius: 9999px;
    background: var(--surface2); color: var(--text); cursor: pointer; font-size: 15px;
    transition: background .15s, color .15s; height: 44px; align-self: flex-end;
    flex-shrink: 0;
  }
  .input-area .upload-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

  .toolbar {
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
    padding: 0 4px; font-size: 12px;
  }
  .toolbar button {
    padding: 4px 12px; border: 1px solid var(--border); border-radius: 9999px;
    background: var(--surface2); color: var(--text); cursor: pointer; font-size: 12px;
    transition: background .15s, color .15s;

  .toolbar button:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .toolbar-spacer { flex: 1; }

  /* ── 右侧定位锚点竖条 ── */
  #msg-anchors {
    position: fixed; right: 10px; top: 70px; bottom: 175px;
    display: flex; flex-direction: column; gap: 4px; z-index: 80;

  .anchor-dot {

  .anchor-dot:hover { background: var(--accent); transform: scale(1.4); opacity: 1; }
  .anchor-dot.active { background: var(--accent); transform: scale(1.3); opacity: 1; }
  /* 2026-09-11: 全量锚点（对齐 DeepSeek 风格），数量密集时压缩尺寸/间距 */
  #msg-anchors.dense { gap: 2px; }
  #msg-anchors.dense .anchor-dot { width: 7px; height: 7px; }
  #msg-anchors.denser { gap: 1px; }
  #msg-anchors.denser .anchor-dot { width: 5px; height: 5px; }

  /* ── 回底圆点 ── */
  #back-to-bottom, #jump-last-user {
    position: fixed; right: 18px; width: 42px; height: 42px;
    border-radius: 50%; border: none; cursor: pointer;

  #jump-last-user { bottom: 68px; background: var(--surface2); color: var(--accent); border: 1px solid var(--border); font-weight: bold; }

  /* ── 移动端响应式 ── */
  @media (max-width: 768px) {
    #sidebar { position: fixed; left: 0; top: 0; bottom: 0; box-shadow: 2px 0 12px rgba(0,0,0,.08); }
    body.sidebar-collapsed #sidebar { margin-left: calc(-1 * var(--sidebar-w)); }
    #btn-hamburger { display: block; }
    #chat { padding-top: 44px; }
    .msg { max-width: 92%; }

    #jump-last-user { bottom: 64px; right: 14px; }
  }

  /* ── 用户友好度增强：info 消息（非错误警示）/ 骨架屏 / 消息时间戳 ── */
  .msg.info {
    align-self: center; background: var(--accent-soft); color: var(--text);

  }
  .msg.system .msg-time { display: block; text-align: left; margin: 2px 0 0; }   /* 2026-08-07: system 时间戳随左对齐 */
  .msg.error .msg-time, .msg.info .msg-time { display: block; text-align: center; margin: 2px 0 0; }
  .crash-notice {
    align-self: stretch;
    margin: 4px 0 8px;
    padding: 8px 12px;
    border: 1px solid #e5534b;
    border-left: 4px solid #e5534b;
    background: rgba(229, 83, 75, 0.08);
    border-radius: var(--radius);
    color: #ffb3ad;

  .crash-notice .crash-ack {

  }
  .crash-notice .crash-ack:hover { background: rgba(229, 83, 75, 0.15); }
  .session-crash-tag {
    color: #ff6b60;

  .loading-skeleton {
    align-self: center; display: flex; flex-direction: column; gap: 8px;
    width: 60%; padding: 12px 16px; border-radius: var(--radius);
    background: var(--surface2); border: 1px solid var(--border);
  }
  .loading-skeleton .sk-line {
    height: 12px; border-radius: 6px;

    background-size: 200% 100%;

  .loading-skeleton .sk-line.short { width: 40%; }
  .loading-skeleton .sk-line.mid { width: 70%; }
  @keyframes sk-shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* ── 2026-08-23: 超长消息折叠（长正文默认折叠，展开按钮恢复）── */

<script>
// ── 相对路径基准：适配反向代理子路径（如 DSW /dsw-xxx/proxy/4096/）──
// 所有 fetch/WS/跳转基于 BASE 拼接，避免绝对路径丢失代理前缀
const BASE = (function(){ var p = location.pathname; return p.endsWith('/') ? p : p.substring(0, p.lastIndexOf('/') + 1); })();
// ── 全局 401 拦截：未认证自动跳转登录页（排除 /api/login 避免死循环）──
(function () {
  var _redirecting = false;
  var _origFetch = window.fetch;
  window.fetch = function () {
    var url = String(arguments[0] || '');
    return _origFetch.apply(this, arguments).then(function (resp) {
      if (resp.status === 401 && url.indexOf('/api/login') === -1 && !_redirecting) {
        _redirecting = true;
        var next = encodeURIComponent(location.pathname + location.search);
        window.location.href = BASE + 'login?next=' + next;
      }
      return resp;
    });
  };
})();
let ws = null;
let currentSession = '';
let sessionTitles = {};   // 2026-09-10: name -> title（后端已把「未设置」回退成 name）
let sessionSwitchPending = '';  // 乐观切换进行中，阻止 poll 覆盖 currentSession
let historyRewritePending = Object.create(null);  // session -> rerun 历史重写待完成
let rerunInFlight = false;                    // 防止重复点击刷新按钮
let sessionSwitchTimer = null;  // 切换超时兜底（防 session_switched 丢失导致 WS 事件永久屏蔽）
let isStreaming = false;
let curMode = 'plan';
let curAutocompactLimit = null;   // autocompactlimit 显示缓存（null=未知/未获取/禁用）
let curLockMsg = null;   // 非空时状态胶囊显示锁占用
let hasWsStats = false;    // v2: 本会话是否收到过 WS stats(当前轮). false=仅看到 db 的上一轮

let sessionCache = {};      // session -> {lastId, messages, ids, renderedIds, renderedContent}；数据缓存（无 DOM 节点），切回全量重建
let sessionRetryCount = {};   // 加载会话消息失败重试计数（分支2降级用）
let loadToken = 0;          // 防竞态：每次 loadSessionMessages 递增，响应时校验仍是当前会话才渲染
const MAX_CACHED_SESSIONS = 10;  // LRU 上限：切换多个会话后释放旧缓存（nodes/messages），防内存无限增长
let reconnectDelay = 1000;  // WS 重连退避基数（1s→2s→4s→...→30s 上限）
let pendingQueue = [];      // 断线期间用户发送的普通消息队列（重连后自动 flush，P0 修复）

function updateModeIndicator() {
  const el = document.getElementById('mode-indicator');
  if (!el) return;
  el.textContent = curMode;
  // 事件只绑定一次：点击=切 mode（保留 Tab 快捷键 toggleMode）
  if (!el.dataset.bound) {
    el.dataset.bound = '1';
    el.onclick = function() { toggleMode(); };
  }
}
function updateLockIndicator() {
  const el = document.getElementById('lock-indicator');
  if (!el) return;
  if (curLockMsg) {
    el.textContent = curLockMsg;
    el.classList.add('has-lock');
  } else {
    el.textContent = '';
    el.classList.remove('has-lock');
  }
}
function updateAutocompactIndicator() {
  const el = document.getElementById('autocompact-indicator');
  if (!el) return;
  if (curAutocompactLimit === null || curAutocompactLimit < 0) {
    el.textContent = '';
    el.classList.remove('has-value');
    el.title = '自动压缩阈值：禁用（/autocompactlimit N 设置）';
  } else {
    el.textContent = '⚙️AC:' + curAutocompactLimit;
    el.classList.add('has-value');
    el.title = '自动压缩阈值：上下文 > ' + curAutocompactLimit + ' tokens 时处理消息前先自动压缩（/autocompactlimit -1 禁用）';
  }
}
function fetchAutocompactLimit(session) {
  // 读取指定 session 的 autocompactlimit（agent 未运行 → null → 隐藏，静默降级）
  const q = session ? ('?session=' + encodeURIComponent(session)) : '';
  fetch(BASE + 'api/autocompactlimit' + q).then(function(r) { return r.json(); }).then(function(d) {
    if (d && d.ok) {
      curAutocompactLimit = (typeof d.value === 'number') ? d.value : null;
      updateAutocompactIndicator();
    }
  }).catch(function() {});
}
let stickToBottom = true;   // 智能滚动：贴底时自动跟随，用户上卷后不打扰
let olderTriggered = false;   // 滚动到顶触发历史加载的防抖标志（避免连续滚动重复触发）
let currentWorkdir = '';    // 项目根（fetchStatus 获取，用于路径链接化）

// ── 输入历史（↑/↓ 切换，对齐 repl._RawReader 的 _history_up/_history_down 语义）──
let inputHistory = [];    // 历史数组，最新在末尾（与 repl._history 顺序一致）
let histIdx = -1;         // -1=未在浏览；>=0=当前浏览下标（对齐 repl._hist_idx）
let histDraft = '';       // 浏览前的草稿，按 ↓ 越过最新一条后恢复（对齐 repl._hist_pending）
let histLoaded = false;   // 后端历史是否已加载；加载失败则静默降级（不阻塞输入）

function loadInputHistory() {
  fetch(BASE + 'api/history?limit=500')
    .then(r => r.json())
    .then(data => { inputHistory = (data.history || []).slice(); histLoaded = true; })
    .catch(() => { histLoaded = false; });   // 降级：API 不可用时仅禁用 ↑/↓
}

function historyUp() {
  if (!histLoaded || inputHistory.length === 0) return;
  if (histIdx === -1) {                       // 首次 ↑：保存当前草稿，跳到最新一条
    histDraft = document.getElementById('input').value;
    histIdx = inputHistory.length - 1;
  } else if (histIdx > 0) {                   // 继续 ↑：逐条回溯
    histIdx -= 1;
  } else {
    return;                                   // 已到最旧一条：保持不动（对齐 repl）
  }
  setHistoryValue();
}

function historyDown() {
  if (!histLoaded || histIdx === -1) return;  // 未在浏览状态：↓ 不动作（对齐 repl）
  histIdx += 1;
  if (histIdx >= inputHistory.length) {       // 越过最新一条：恢复浏览前草稿
    histIdx = -1;
    document.getElementById('input').value = histDraft;
    histDraft = '';
  } else {
    setHistoryValue();
  }
}

function setHistoryValue() {
  const input = document.getElementById('input');
  input.value = inputHistory[histIdx];
  input.selectionStart = input.selectionEnd = input.value.length;  // 光标移到末尾
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
}

// 光标是否位于输入框第一行（之前无换行符）——↑ 触发历史切换的判定条件
function isCaretAtFirstLine() {
  const input = document.getElementById('input');
  return input.value.slice(0, input.selectionStart).indexOf('\n') === -1;
}
// 光标是否位于输入框最后一行（之后无换行符）——↓ 触发历史切换的判定条件
function isCaretAtLastLine() {
  const input = document.getElementById('input');
  return input.value.slice(input.selectionEnd).indexOf('\n') === -1;
}

function onInputKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); return false; }
  if (e.key === 'Tab' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); toggleMode(); return false; }
  if (e.key === 'ArrowUp' && !e.shiftKey) {
    // ↑ 仅在第一行或已进入历史浏览时接管为历史切换；多行中间位置让浏览器默认移动光标
    if (histIdx >= 0 || isCaretAtFirstLine()) { e.preventDefault(); historyUp(); return false; }
  }
  if (e.key === 'ArrowDown' && !e.shiftKey) {
    // ↓ 仅在最后一行或已进入历史浏览时接管为历史切换；多行中间位置让浏览器默认移动光标
    if (histIdx >= 0 || isCaretAtLastLine()) { e.preventDefault(); historyDown(); return false; }
  }
  return true;   // 其余按键（含 Shift+Enter 换行、Shift+↑/↓ 选择）交给浏览器默认行为
}

function connect() {
  if (ws) ws.close();
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host + BASE + 'ws');
  ws.onopen = () => {
    reconnectDelay = 1000;    // 连接成功 → 重置退避
    clearSessionSwitchPending();  // 断线期间未完成的切换不再屏蔽 WS 事件
    addMsg('system', '🟢 Connected');
    // P0 修复：断线期间积压的普通消息重连后自动 flush（不丢失用户输入）
    if (pendingQueue.length) {
      const q = pendingQueue.slice();
      pendingQueue = [];
      q.forEach(t => ws.send(JSON.stringify({type:'chat', text:t, session: currentSession || ''})));
      addMsg('info', '📤 已自动重发 ' + q.length + ' 条离线消息');
    }
    fetchStatus().then(() => {
      // P0 修复：重连路径保留当前视图（不清空、不滚底），仅增量补新
      if (currentSession) loadSessionMessages(currentSession, {preserveView:true});
    });
    fetchSessions();  // FIX: 连接建立即加载 sessions 列表（问题1：初始为空）
    fetchQueueSnapshot();   // 2026-08-30(v1.1): 重连后重建排队视图（快照含 qid 可取消）
  };
  ws.onclose = (ev) => {
    // 未认证（4001）→ 跳转登录页，不重连（避免死循环）
    if (ev && ev.code === 4001) {
      window.location.href = BASE + 'login';
      return;
    }
    // P2: 指数退避重连（1s→30s 上限），避免频繁失败时消息刷屏
    addMsg('system', '🔴 连接断开（' + Math.round(reconnectDelay/1000) + 's 后重试）');
    var d = reconnectDelay;
    reconnectDelay = Math.min(reconnectDelay * 2, 30000);
    setTimeout(connect, d);
  };
  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      handleWsMsg(msg);
    } catch(err) {}
  };
}

function sessionIsBusy(agents, s) {
  var ag = agents && agents[s];
  // 2026-09-04 修复：busy 口径对齐后端 _target_busy——除 agent 回合活跃（turn_active）
  // 外，WS 转发任务未结束（chat_forward_busy）也算忙，避免转发卡死时"静默排队"
  return !!ag && ag.status === 'running' && (ag.turn_active === true || ag.chat_forward_busy === true);
}

function handleStreamGap(msg) {
  var sess = msg.session || currentSession;
  var c = sessionCache[sess];
  if (c && c.ids && c.ids.size) fetchIncremental(sess, c, loadToken, null);
}

function clearSessionSwitchPending() {
  sessionSwitchPending = '';
  if (sessionSwitchTimer) { clearTimeout(sessionSwitchTimer); sessionSwitchTimer = null; }
  updateInputSwitchLock();
}

function updateInputSwitchLock() {
  var locked = !!sessionSwitchPending;
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('send-btn');
  var modeEl = document.getElementById('mode-indicator');
  var ph = 'Enter 发送 · Shift+Enter 换行 · ↑/↓ 顶/底行切历史 · Tab 切 mode';
  if (input) {
    input.disabled = locked;
    input.placeholder = locked ? '切换会话中…' : ph;
  }
  if (sendBtn) sendBtn.disabled = locked && !isStreaming;
  if (modeEl) modeEl.classList.toggle('disabled', locked);
}

function armSessionSwitchPending(name) {
  clearSessionSwitchPending();
  sessionSwitchPending = name;
  updateInputSwitchLock();
  sessionSwitchTimer = setTimeout(function() {
    if (sessionSwitchPending !== name) return;
    clearSessionSwitchPending();
    addMsg('info', '⚠️ 切换会话超时，请重试');
  }, 8000);
}

function completeHistoryRewrite(session) {
  if (!historyRewritePending[session]) return;
  delete historyRewritePending[session];
  delete sessionCache[session];
  if (session === currentSession) loadSessionMessages(session);
}

function handleWsMsg(msg) {
  const type = msg.type;
  // rerun 已在后端物理截断历史；清空旧 DOM，回合结束后从 DB 重建。
  if (type === 'history_reset') {
    var resetSession = msg.session || (msg.data && msg.data.session) || currentSession;
    if (!resetSession) return;
    historyRewritePending[resetSession] = true;
    delete sessionCache[resetSession];
    if (resetSession === currentSession) {
      clearChat();
      var resetText = (msg.data && msg.data.text) || '';
      if (resetText) addMsg('user', resetText);
      isStreaming = true;
      setStopBtnVisible(true);
    }
    return;
  }
  // 乐观切换窗口：WS 事件一律缓冲，等 session_switched 后 loadSessionMessages 重放
  if (sessionSwitchPending && type !== 'session_switched') {
    if (type === 'error') {
      clearSessionSwitchPending();
      // fall through：展示错误（如 session 不存在）
    } else if (type === 'info' || type === 'system' || type === 'mode_changed' ||
               type === 'lock_status_changed') {
      // 切换中仍展示 busy/mode 等反馈（无 session 标签的系统消息）
    } else {
      if (msg.session) handleBackgroundEvent(msg);
      else if (type === 'stream_gap') handleStreamGap(msg);
      return;
    }
  }
  // C1（2026-08-21）：后台 session 事件分流——事件带 session 且非当前会话时，
  // 只更新该 session 的缓存缓冲（pendingLive），不渲染 DOM（单 #chat 容器约束）。
  // 切回时 loadSessionMessages 会把 pendingLive 以实时方式重放，实时流无缝继续。
  if (msg.session && msg.session !== currentSession) {
    handleBackgroundEvent(msg);
    return;
  }
  if (type === 'stream_gap') {
    handleStreamGap(msg);
    return;
  }
  if (type === 'text') {
    isStreaming = true;
    setStopBtnVisible(true);
    collapseLastToolResult();   // 2026-08-10: 文本开始 → 折叠上一个 tool_result 框
    clearThinkingWait();        // 思考阶段结束（或无需等待提示）
    appendStreaming(msg.data);
  } else if (type === 'thinking') {
    // 重构：thinking 显示为可折叠框（无内容时仅占位）
    // P1-1: thinking 即回合开始，置 isStreaming 拦截重复发送（对齐后端 busy）
    isStreaming = true;
    setStopBtnVisible(true);
    collapseLastToolResult();   // 2026-08-10: 新一轮思考开始 → 折叠上一个 tool_result 框
    ensureThinkingEl();
    startThinkingWait();        // 2026-08-10: 思考等待心跳——卡顿可见
  } else if (type === 'thinking_content') {
    // 重构：思考链内容实时追加到折叠框
    clearThinkingWait();        // 2026-08-10: 有内容 → 移除等待占位
    appendThinking(msg.data);
    startThinkingWait();        // 2026-08-10: 重置 15s 窗口，思考流中停顿仍可见
  } else if (type === 'clear_thinking') {
    // 重构：思考完成 → 封板保留折叠框（可展开回顾），不删除
    finalizeThinking();
  } else if (type === 'tool_call') {
    // 重构：tool 调用独立折叠框（tool_call 到达时封板当前文本段，防止顶出）
    collapseLastToolResult();   // 2026-08-10: 工具开始 → 折叠上一个 tool_result 框
    clearThinkingWait();
    appendToolBox('tool_call', msg.data);
  } else if (type === 'tool_progress') {
    // 方案2: 工具执行进度实时追加到当前 tool 折叠框
    appendToolProgress(msg.data);
  } else if (type === 'tool_result') {
    // 重构：tool 结果独立折叠框
    appendToolBox('tool_result', msg.data);
  } else if (type === 'stats') {
    // 对齐 repl：显示本轮（单次 LLM 调用）token 用量，不再取会话累积值
    hasWsStats = true;   // v2: 已收到当前轮 stats -> 后续 updateStats 不回退上一轮
    updateStatsFrom(msg.data || {});
  } else if (type === 'done') {
    // 重构：done → 封板 thinking 与文本段（thinking 保留可展开）
    collapseLastToolResult();   // 2026-08-10: 回合结束 → 折叠最后一个 tool_result 框
    clearThinkingWait();
    finalizeThinking();
    var _lastAsst = lastAssistantEl;  // finalizeTextEl 末尾置 null，先保存引用
    // 2026-08-10: 实时回合结束，给 assistant 头部补耗时提示（距上条 user 消息）
    if (_lastAsst && lastUserMsgTs) {
      var latHead = _lastAsst.querySelector('.msg-head');
      var latStr2 = formatLatency(lastUserMsgTs, new Date().toISOString());
      if (latHead && latStr2 && !latHead.querySelector('.msg-latency')) {
        var latSpan2 = document.createElement('span');
        latSpan2.className = 'msg-latency';
        latSpan2.textContent = '⏱ ' + latStr2;
        latHead.appendChild(latSpan2);
      }
    }
    finalizeTextEl();
    isStreaming = false;
    setStopBtnVisible(false);
    updateStats();
    scrollToBottomIfSticky();   // 2026-08-12: done 后贴底才补滚（markdown 高度变化）；用户上卷不打扰
    fetchSessions();  // 需求1：回合完成即时刷新列表（状态→idle，忙标记清除）
    rerunInFlight = false;
    if (historyRewritePending[currentSession]) {
      completeHistoryRewrite(currentSession);
      return;
    }
    // 修复（2026-08-23）：回合完成 → 清空 pendingLive 中已入缓冲的 user 事件
    // （用户消息已落库，切回时从 DB 渲染，避免 replayPendingLive 重复渲染）。
    if (currentSession && sessionCache[currentSession] && sessionCache[currentSession].pendingLive) {
      sessionCache[currentSession].pendingLive = sessionCache[currentSession].pendingLive.filter(function(evU) { return evU.type !== 'user'; });
    }
    // A+B: 回合完成 → 静默增量记账（推进 lastId/ids），防止后续增量拉取重渲本回合已实时渲染的消息
    if (currentSession) syncCacheAfterDone(currentSession);
  } else if (type === 'mode_changed') {
    if (msg.session && msg.session !== currentSession) return;
    setMode(msg.data);
  } else if (type === 'lock_status_changed') {
    if (msg.session && msg.session !== currentSession) return;
    updateLockTag(msg.data);
  } else if (type === 'session_switched') {
    // A4 修复（2026-08-22）：快速连续切换时忽略过期响应（pending 已指向更新的目标），
    // 避免旧 session 的 session_switched 触发多余 loadSessionMessages 与中间态闪烁
    if (sessionSwitchPending && sessionSwitchPending !== msg.data.session) return;
    // A5 修复（2026-08-22）：乐观切换（switchSession 已 loadSessionMessages 并重放 pendingLive）
    // 时，session_switched 不再重建消息区——重建会 clearChat 清空已重放的最新消息
    // （正在执行的回合未结束不落库，DB 增量拉不到 → 最新消息消失，只剩上一轮）。
    // 只做增量补新；非乐观路径（后端主动切换）仍完整加载。
    var wasOptimistic = (sessionSwitchPending === msg.data.session);
    clearSessionSwitchPending();
    // P2: 切换 session 后重置流式状态（旧回合可能被取消且未发 done，
    // 若不清除 isStreaming 将导致前端无法再发送新消息）
    clearThinkingWait();
    collapseLastToolResult();
    finalizeThinking();
    finalizeTextEl();
    currentSession = msg.data.session;
    rerunInFlight = false;
    document.getElementById('session-name').textContent = currentSession;
    updateSessionTitleBox();
    delete pendingSessions[currentSession];  // 已进入该会话：清除待查看标记
    queuedItems = [];   // 2026-08-30: 切换会话 → 清空本地排队镜像（后端队列仍在，快照/续跑事件重建）
    renderQueueItems();   // v1.2: 立即刷新队列条（快照随后重建该会话视图）
    touchRecent(currentSession);  // 需求2：ws 路径同步 MRU（与 switchSession 对齐）
    hasWsStats = false;  // v2: 切 session 重置——新会话未收到 stats 前显示其上一轮(db last_*)
    if (wasOptimistic) {
      // 乐观加载已渲染（含 pendingLive 重放）→ 仅增量补新，不重建
      var cached = sessionCache[currentSession];
      if (cached && cached.ids && cached.ids.size) {
        fetchIncremental(currentSession, cached, ++loadToken, null);
      } else {
        loadSessionMessages(currentSession);   // 缓存未就绪（新 session 首次加载）→ 完整加载
      }
    } else {
      loadSessionMessages(currentSession);
    }
    // busy 必须在 replayPendingLive 之后应用（重放 done 不应覆盖仍活跃的 forward/turn）
    isStreaming = !!msg.data.busy;
    setStopBtnVisible(isStreaming);
    fetchSessions();
    fetchStatus();  // FIX: 切 session 后刷新 mode 标签（显示新 session 真实 mode）
    fetchQueueSnapshot();   // 2026-08-30(v1.1): 切会话后重建该会话排队视图
    fetchAutocompactLimit(currentSession);  // 切会话后刷新 autocompactlimit 显示
  } else if (type === 'command_result') {
    if (msg.data) {
      addMsg("tool", "💻 " + msg.data);
      // /autocompactlimit 命令结果 → 就地更新 indicator（免额外 API 轮询）
      var _acm = String(msg.data).match(/autocompactlimit\s*=\s*(-?\d+)/);
      if (_acm) { curAutocompactLimit = parseInt(_acm[1], 10); updateAutocompactIndicator(); }
    }
  } else if (type === 'error') {
    // 重构：error → 封板 thinking 与文本段
    collapseLastToolResult();   // 2026-08-10: 错误 → 折叠 tool_result 框
    clearThinkingWait();
    finalizeThinking();
    finalizeTextEl();
    isStreaming = false;
    setStopBtnVisible(false);
    addMsg('error', '❌ ' + msg.data);
    rerunInFlight = false;
    if (historyRewritePending[currentSession]) {
      delete historyRewritePending[currentSession];
      delete sessionCache[currentSession];
      loadSessionMessages(currentSession);
    }
  } else if (type === 'system') {
    addMsg('system', msg.data);
  } else if (type === 'chat_queued') {
    // 2026-08-30(v1.2): 消息确认进入会话级排队 → 从消息流移除待确认气泡，展示到队列条列表
    if (msg.session && msg.session !== currentSession) return;
    var qId = (msg.data && msg.data.qid) || '';
    var qText = (msg.data && msg.data.text) || '';
    if (qId && qText) {
      var dup = false;
      for (var cqi = 0; cqi < queuedItems.length; cqi++) {
        if (queuedItems[cqi].qid === qId) { dup = true; break; }
      }
      if (!dup) queuedItems.push({qid: qId, text: qText,
        dropped: dropPendingBubble(qText)});   // v1.2: 排队消息不混入用户消息流，记录气泡是否已从流中移除
      renderQueueItems();
    }
  } else if (type === 'chat_dequeued') {
    // v1.2: 排队消息开始处理 → 从队列条移除并渲染为真实用户消息（此时才进入消息流）
    if (msg.session && msg.session !== currentSession) return;
    var dqId = (msg.data && msg.data.qid) || '';
    var dqText = (msg.data && msg.data.text) || '';
    var dqDropped = false;   // 该消息气泡是否已随 chat_queued 从消息流移除（决定是否重新渲染）
    for (var dqi = 0; dqi < queuedItems.length; dqi++) {
      if (queuedItems[dqi].qid === dqId) { dqDropped = !!queuedItems[dqi].dropped; queuedItems.splice(dqi, 1); break; }
    }
    // 防御：chat_queued 竞态下气泡可能仍留在消息流（data-queue-pending）——
    // 此时气泡已是该消息的正确渲染位置，复用之不重复 addMsg；气泡已移除 → 渲染为真实用户消息
    if (dqText && (dqDropped || !hasPendingBubble(dqText))) addMsg('user', dqText);
    renderQueueItems();
    lastUserMsgTs = new Date().toISOString();   // 耗时从实际开始处理起算
    isStreaming = true;
    setStopBtnVisible(true);
  } else if (type === 'chat_queue_cleared') {
    // Stop/rerun/停止会话/清空队列 → 移除全部排队条目（消息已不会处理，保留会误导）
    if (msg.session && msg.session !== currentSession) return;
    queuedItems = [];
    renderQueueItems();
  } else if (type === 'chat_cancelled') {
    // 2026-08-30(v1.1): 单条排队消息取消成功 → 从队列条列表移除并重编号
    if (msg.session && msg.session !== currentSession) return;
    var ccId = (msg.data && msg.data.qid) || '';
    for (var cci = 0; cci < queuedItems.length; cci++) {
      if (queuedItems[cci].qid === ccId) { queuedItems.splice(cci, 1); break; }
    }
    renderQueueItems();
    addMsg('info', '🗑️ 已取消排队消息');

  } else if (type === 'info') {
    // P1: 非错误提示（如 busy / 离线排队 / 处理中）— 浅色样式而非红色 ❌
    if (msg.session && msg.session !== currentSession) return;
    addMsg('info', msg.data);
  }
}

// C1（2026-08-21）：后台 session 事件只入缓存缓冲，不渲染 DOM。
// pendingLive: sessionCache[session].pendingLive = [{type, data}, ...]
// 事件类型与实时一致（thinking/text/tool_call/tool_progress/tool_result/done/...），
// 切回时由 loadSessionMessages 重放（复用实时渲染函数），实时流无缝继续。
function ensurePendingLive(session) {
  if (!sessionCache[session]) {
    sessionCache[session] = { lastId: 0, messages: [], ids: new Set(), renderedIds: new Set(), renderedContent: new Map() };
  }
  if (!sessionCache[session].pendingLive) sessionCache[session].pendingLive = [];
  return sessionCache[session].pendingLive;
}
const BACKGROUND_PROGRESS_MAX = 50;   // 2026-08-23: 后台缓冲合并后 progress 条目上限（过程性内容，最终以 tool_result 为准）
function handleBackgroundEvent(msg) {
  var session = msg.session;
  if (!session) return;
  var pl = ensurePendingLive(session);
  // 2026-08-23: 后台缓冲预合并——切走期间高频内容事件若原样累积（text/thinking
  // 逐 chunk、progress 逐行），切回重放会产生几百上千次 DOM 操作（切换卡顿根因）。
  // 这里把连续同类内容事件合并为少量条目，重放时一次渲染整段。
  var t = msg.type;
  if (t === 'text' || t === 'thinking_content') {
    // 连续同类型内容事件合并为一条（字符串累积；整段在一次 append 中渲染）
    var last = pl.length ? pl[pl.length - 1] : null;
    if (last && last.type === t) {
      last.data += (msg.data || '');
    } else {
      pl.push({ type: t, data: msg.data || '', session: session });
    }
    return;
  }
  if (t === 'tool_progress') {
    // 连续 progress 行合并为一条（换行连接），总量限 BACKGROUND_PROGRESS_MAX 条；
    // 进度为过程性内容，最终以 tool_result 为准，超限丢最旧。
    var line = (msg.data && msg.data.line) || '';
    var last2 = pl.length ? pl[pl.length - 1] : null;
    if (last2 && last2.type === 'tool_progress') {
      last2.data = { line: last2.data.line + '\n' + line };
    } else {
      pl.push({ type: 'tool_progress', data: { line: line }, session: session });
    }
    var cnt = 0;
    for (var i = pl.length - 1; i >= 0; i--) {
      if (pl[i].type === 'tool_progress') cnt++;
    }
    if (cnt > BACKGROUND_PROGRESS_MAX) {
      for (var k = 0; k < pl.length; k++) {
        if (pl[k].type === 'tool_progress') { pl.splice(k, 1); break; }
      }
    }
    return;
  }
  if (t === 'stats') {
    // 只保留最后一个 stats（重放只更新一次）
    for (var j = pl.length - 1; j >= 0; j--) {
      if (pl[j].type === 'stats') pl.splice(j, 1);
    }
    pl.push({ type: 'stats', data: msg.data, session: session });
    return;
  }
  // 状态类事件（thinking/clear_thinking/tool_call/tool_result/done/error/system）原样入缓冲
  if (t === 'thinking' || t === 'clear_thinking' || t === 'tool_call' ||
      t === 'tool_result' || t === 'done' || t === 'error' || t === 'system') {
    pl.push({ type: t, data: msg.data, session: session });
  }
  if (t === 'stream_gap') handleStreamGap(msg);
  // 后台回合结束（done/error）→ 触发该 session 缓存记账（推进 lastId/ids），
  // 切回时增量拉取不会重渲已缓冲内容。
  if (t === 'done' || t === 'error') {
    var c = sessionCache[session];
    // 修复（2026-08-23）：后台回合结束 → 清空该 session pendingLive 中已入缓冲的 user 事件
    // （用户消息已落库，切回时从 DB 渲染，避免 replayPendingLive 重复渲染）。
    if (c && c.pendingLive) {
      c.pendingLive = c.pendingLive.filter(function(evU2) { return evU2.type !== 'user'; });
    }
    if (historyRewritePending[session]) {
      delete historyRewritePending[session];
      delete sessionCache[session];
      rerunInFlight = false;
      return;
    }
    if (c && c.ids && c.ids.size) syncCacheAfterDone(session);
  }
}

// C1+（2026-08-22）：重放覆盖切走期间的新消息 → 补记 renderedIds（防重复渲染）。
// 前提：pendingLive 非空且已由 replayPendingLive 重放，切走期间新消息内容已在 DOM 中。
function markNewRendered(session) {
  var c = sessionCache[session];
  if (!c) return;
  var maxRendered = -1;
  c.renderedIds.forEach(function(id) { if (id > maxRendered) maxRendered = id; });
  c.messages.forEach(function(m) {
    if (m._id > maxRendered && !c.renderedIds.has(m._id)) c.renderedIds.add(m._id);
  });
}

// C1（2026-08-21）：切回时重放后台缓冲的实时事件。
// 复用实时渲染函数（ensureThinkingEl/appendThinking/appendStreaming/appendToolBox），
// 事件顺序与实时一致；done 封板。重放后清空缓冲（内容已渲染到 DOM）。
function replayPendingLive(session) {
  var c = sessionCache[session];
  if (!c || !c.pendingLive || !c.pendingLive.length) return;
  var pl = c.pendingLive;
  c.pendingLive = [];
  // 重放前先封板当前残留（thinking/text 未 done 时），保证重放从干净状态开始
  finalizeThinking();
  finalizeTextEl();
  for (var i = 0; i < pl.length; i++) {
    var ev = pl[i];
    var t = ev.type;
    if (t === 'user') {
      // 修复（2026-08-23）：重放用户消息（send 时入缓冲），位于 LLM 回复之前；
      // addMsg 内部 trackRendered 记账，fetchIncremental 拉到真实 user 时 n>0 补记不重复。
            var replayUserEl = addMsg('user', ev.data || '');
      replayUserEl.dataset.queuePending = '1';   // v1.2: 待确认——快照/chat_dequeued 到达时按需从消息流移除
    } else if (t === 'thinking') {
      ensureThinkingEl();
    } else if (t === 'thinking_content') {

function runMermaid(root) {

  const pres = Array.prototype.slice.call(root.querySelectorAll('pre.mermaid'));
  if (!pres.length) return;
  const nodes = pres.filter(function (pre) {
    if (pre.dataset.mermaidState === 'done') return false;   // 防重复渲染
    if (!pre.dataset.mermaidCode) pre.dataset.mermaidCode = pre.textContent;  // 先保存原文（加载/渲染期间不可丢）

      try {
        return !(mm.parse && mm.parse(pre.dataset.mermaidCode, { suppressErrors: true }) === false);
      } catch (e) { return false; }

    nodes.forEach(function (pre) {
      if (valid.indexOf(pre) === -1) { pre.classList.remove('mermaid-loading'); pre.dataset.mermaidState = 'done'; }
    });
    if (!valid.length) return;
    mm.run({ nodes: valid, suppressErrors: true }).then(function () {
      valid.forEach(function (pre) { pre.classList.remove('mermaid-loading'); pre.dataset.mermaidState = 'done'; });
    }).catch(function () {
      valid.forEach(function (pre) { pre.classList.remove('mermaid-loading'); pre.dataset.mermaidState = 'done'; });
    });
  }).catch(function () {
    // 加载失败（离线/CDN 不可达）→ 降级为普通代码块，页面不受影响
    nodes.forEach(function (pre) { pre.classList.remove('mermaid-loading'); pre.dataset.mermaidState = 'done'; });
  });
}

// ── 路径链接化：将回复中的项目路径/文件名转为可点击链接（新标签打开）──
// 三档匹配：绝对(项目根前缀) / 相对(含目录分隔) / 裸文件名(后缀白名单)
// 设计：DOM 后处理（TreeWalker 文本节点），零侵入 mdToHtml；
//       跳过 code/pre/a 内部，避免破坏代码块与已有链接；href 仅指向自家 /api/files/open。
const FILE_EXT_SET = 'markdown|ipynb|webp|yaml|json|html|docx|jpeg|conf|toml|java|tsx|jsx|txt|tex|rst|log|css|htm|xml|sql|ini|cfg|png|jpg|gif|svg|bmp|ico|pdf|csv|yml|php|cpp|md|py|js|ts|go|rs|rb|sh|c|h';

  const urlSpans = [];

  const hasLB = (s) => s <= 0 || !/[A-Za-z0-9_.\/-]/.test(text[s - 1]);

  if (currentWorkdir) {
    const esc = currentWorkdir.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

  // 2) 相对路径：至少含一个目录分隔符；排除 / 开头的本地API路径（/api/...）
  let m;
  while ((m = REL_PATH_RE.exec(text))) {
    if (m[0].startsWith('/')) continue;  // /xxx 形式（非项目根前缀）不链
    if (hasLB(m.index) && !inUrlSpan(m.index, m.index + m[0].length)) {
      if (FILE_TAIL_RE.test(trimPathTail(m[0]))) cands.push({s: m.index, e: m.index + m[0].length, p: m[0]});
    }
  }
  // 3) 裸文件名：文本/代码/图片等常见后缀白名单
  while ((m = BARE_FILE_RE.exec(text))) {
    if (hasLB(m.index) && !inUrlSpan(m.index, m.index + m[0].length)) {
      cands.push({s: m.index, e: m.index + m[0].length, p: m[0]});
    }
  }
  // 排序 + 重叠去重（保留最长匹配，避免绝对/相对/裸名互相覆盖）
  cands.sort((a, b) => a.s - b.s || (b.e - b.s) - (a.e - a.s));

  let _wallResidue = text;
  for (let _wi = _wallMatches.length - 1; _wi >= 0; _wi--) {
    _wallResidue = _wallResidue.slice(0, _wallMatches[_wi].s) + _wallResidue.slice(_wallMatches[_wi].e);
  }
  const wallMode = _wallMatches.length > 0 &&
    /^[\s，。、；,;:：|]*$/.test(_wallResidue) &&
    _wallMatches.some(function (_wm) { return _IMG_RE.test(trimPathTail(_wm.p)); });
  const frag = document.createDocumentFragment();
  let rest = text;
  let done = 0;
  // 循环：截断粘连后剩余文本重新匹配（web.py和manager.py → 两个链接）
  while (rest.length) {
    const matches = collectPathMatches(rest);
    if (!matches.length) break;
    const mt = matches[0];               // 最左匹配（去重后有序）
    mt.p = trimPathTail(mt.p);           // 截断粘连（web.py和x.py → web.py）
    if (!mt.p.length) { frag.appendChild(document.createTextNode(rest)); done += rest.length; break; }
    mt.e = mt.s + mt.p.length;
    if (mt.s > 0) frag.appendChild(document.createTextNode(rest.slice(0, mt.s)));
    const _low = mt.p.toLowerCase();
    if (wallMode && _IMG_RE.test(_low)) {
      const img = document.createElement('img');
      img.className = 'md-img-linkify';
      img.src = BASE + 'api/files/download?path=' + encodeURIComponent(mt.p) + '&preview=true&resolve=1' +
        (currentSession ? '&session=' + encodeURIComponent(currentSession) : '');
      img.alt = mt.p;
      img.dataset.name = mt.p;
      img.onerror = function () { mdImgError(this); };
      img.loading = 'lazy';
      img.title = mt.p;
      img.onclick = function () { window.open(this.src); };
      frag.appendChild(img);
    } else {
      const a = document.createElement('a');
      a.className = 'file-link';
      const _pv = /\.(png|jpe?g|gif|webp|bmp|svg|ico|html?|pdf)$/.test(_low);
      a.href = BASE + (_pv ? 'api/files/download?path=' : 'api/files/open?path=') + encodeURIComponent(mt.p) + (currentSession ? '&session=' + encodeURIComponent(currentSession) : '') + (_pv ? '&preview=1' : '') + '&resolve=1';
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = mt.p;
      frag.appendChild(a);
    }
    done += mt.e;
    rest = rest.slice(mt.e);
  }
  if (done < text.length) frag.appendChild(document.createTextNode(text.slice(done)));
  parent.replaceChild(frag, node);
}

function linkifyFilePaths(container) {
  if (!container) return;
  const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(linkifyTextNode);
}

// ── 文本段（每轮 LLM 输出独立成框，打字机效果）──
function ensureTextEl() {
  // 统一渲染核心：与历史 renderMessage 共用 buildAssistantEl（stream 模式建容器，流式填充）
  if (!lastAssistantEl || lastAssistantEl.dataset.finalized === 'true') {
    const chat = document.getElementById('chat');
    var built = buildAssistantEl({ content: '' }, { mode: 'stream' });
    lastAssistantEl = built.el;
    chat.appendChild(lastAssistantEl);
    appendAnchor(lastAssistantEl);
  }
  return lastAssistantEl;
}

function appendStreaming(text) {
  const el = ensureTextEl();
  el.dataset.raw += text;   // 原文累积，done 后统一渲染
  const body = el.querySelector('.md-body, .code-body');
  if (body) {
    // 2026-08-23: code 模式也增量追加文本节点（原 textContent=raw 每次全量重设 O(n²)，
    // 长消息流式期间主线程卡顿；视图切换/收尾时按 dataset.raw 重建）
    body.appendChild(document.createTextNode(text));
  }
  scheduleScrollIfSticky();   // 2026-08-23: rAF 节流滚底（原每 chunk 同步滚底强制 layout）
}

function finalizeTextEl() {
  if (lastAssistantEl) {
    // markdown 渲染：text 模式在收尾时把累积原文渲染为 HTML
    if (lastAssistantEl.dataset.mode === 'text') {
      const body = lastAssistantEl.querySelector('.md-body');
      const raw = lastAssistantEl.dataset.raw;
      const el = lastAssistantEl;
      const render = function() {
        if (body) body.innerHTML = mdToHtml(raw);
        if (body) linkifyFilePaths(body);   // 路径链接化（done 后）
        if (body) runMermaid(body);   // Mermaid 渲染（懒加载）
        maybeCollapseLongBody(body, raw.length);   // 2026-08-23: 超长正文默认折叠
      };
      // P2 性能优化：超长消息（>8KB）延迟到 rAF 渲染，避免 markdown 解析阻塞主线程导致卡顿
      if (raw.length > 8192 && window.requestAnimationFrame) {
        requestAnimationFrame(render);
      } else {
        render();
      }
    }
    // A+B: assistant 封板 → 完整文本记账（增量内容级去重）
    if (lastAssistantEl.dataset.raw) trackRendered('assistant', lastAssistantEl.dataset.raw);
    lastAssistantEl.dataset.finalized = 'true';
    lastAssistantEl = null;
  }
}

// ── TXT/CODE 视图切换（TXT=markdown 渲染，CODE=原文；偏好存 localStorage）──
function getDefaultViewMode() {
  try { return (localStorage.getItem('mdViewMode') || 'text') === 'code' ? 'code' : 'text'; } catch(e) { return 'text'; }
}

// ── 方案2: 工具执行进度渲染（rAF 节流批量追加，行数上限防卡）──
var lastToolBoxProgressEl = null;
var pendingProgressLines = [];
var progressRafScheduled = false;
var TOOL_PROGRESS_MAX_LINES = 500;   // 行数上限：超限丢弃后续行（进度尽力而为）

// ── 2026-08-11: 工具参数 markdown 模板渲染（替代裸 JSON.stringify）──
// 设计：args 逐参数转 markdown 模板，复用 mdToHtml 渲染：
//   标量 → **key**: 值；长文本/代码 → **key**: + ```lang 代码块（不截断）；
//   对象/数组 → **key**: + ```json 代码块
function mdCodeBlock(text, lang) {
  // 防围栏冲突：行首 ``` 加零宽空格拆开，避免提前闭合代码块
  var safe = String(text).replace(/^```/gm, '`\u200b``');
  return '```' + (lang || '') + '\n' + safe + '\n```';
}

function toolArgsToMarkdown(name, args, fileContent) {
  if (!args || typeof args !== 'object') {
    return mdCodeBlock(args === undefined ? '' : String(args), 'json');
  }
  var parts = [];
  var keys = Object.keys(args);
  for (var i = 0; i < keys.length; i++) {
    var k = keys[i];
    var v = args[k];
    var label = '**' + k + '**:';
    if (v === null || v === undefined) { parts.push(label + ' ' + v); continue; }
    if (typeof v === 'string') {
      // pythonrt + .py 文件 → 优先用后端预读内容
      if (k === 'code_or_filepath' && name === 'pythonrt' && v.trim().endsWith('.py') && fileContent) {
        parts.push(label + '\n' + mdCodeBlock(fileContent, 'python'));
        continue;
      }
      if (v.indexOf('\n') !== -1 || v.length > 120) {
        parts.push(label + '\n' + mdCodeBlock(v, k === 'code_or_filepath' ? 'python' : ''));
      } else {
        parts.push(label + ' `' + v + '`');
      }
      continue;
    }
    if (typeof v === 'object') {
      parts.push(label + '\n' + mdCodeBlock(JSON.stringify(v, null, 2), 'json'));
      continue;
    }
    parts.push(label + ' ' + v);
  }
  return parts.join('\n\n');
}

function summaryBodyFromOutput(output) {
  if (!output) return '';
  return String(output).split('\n').filter(function(line) {
    return !/^📌/.test(line) && !/^✅ 已持久化/.test(line) && !/^📄/.test(line) && !/^🏷️/.test(line);
  }).join('\n').trim();
}

function appendToolProgress(data) {
  if (!data || !data.line) return;
  pendingProgressLines.push(data.line);
  if (!progressRafScheduled) {
    progressRafScheduled = true;
    if (window.requestAnimationFrame) requestAnimationFrame(flushProgressLines);
    else flushProgressLines();
  }
}

function flushProgressLines() {
  progressRafScheduled = false;
  if (!lastToolBoxProgressEl) { pendingProgressLines = []; return; }
  var pre = lastToolBoxProgressEl;
  if (pendingProgressLines.length > 0 && pre.style.display === 'none') {
    pre.style.display = '';   // 首次有进度时显示进度区
  }
  for (var i = 0; i < pendingProgressLines.length; i++) {
    if (pre.childElementCount >= TOOL_PROGRESS_MAX_LINES) break;
    var div = document.createElement('div');
    div.className = 'progress-line';
    div.textContent = pendingProgressLines[i];
    pre.appendChild(div);
  }
  pendingProgressLines = [];
  scrollToBottomIfSticky();   // 2026-08-12: 进度贴底才跟随，用户上卷不打扰
}

function appendToolBox(kind, data) {
  // 统一渲染核心：与历史 renderToolHistory tool 分支共用 buildToolBox（stream 模式展开执行中）
  // tool_call 到达时先封板当前文本段（finalizeTextEl），保证每轮 LLM 输出独立成框，
  // 文本框按序排列、不会被 tool 框顶出视口。
  if (kind === 'tool_call') finalizeTextEl();
  const chat = document.getElementById('chat');
  var built = buildToolBox(data, kind, { mode: 'stream' });
  var el = built.el;
  // 实时 summary 正文块（stream 路径：data 用 stdout，与 buildToolBox 的 content 分支互补）
  if (kind === 'tool_result' && data.name === 'summary' && data.stdout) {
    var _content = summaryBodyFromOutput(data.stdout);
    if (_content) {
      var _cdiv = document.createElement('div');
      _cdiv.className = 'msg assistant summary-content';
      var _cbody = document.createElement('div');
      _cbody.className = 'md-body';
      _cbody.innerHTML = mdToHtml(_content);
      linkifyFilePaths(_cbody);
      runMermaid(_cbody);   // Mermaid 渲染（懒加载）
      _cdiv.appendChild(_cbody);
      el.appendChild(_cdiv);
    }
  }
  chat.appendChild(el);
  appendAnchor(el);
  scrollToBottomIfSticky();   // 2026-08-12: 工具框贴底才跟随，用户上卷不打扰
}

function addMsg(role, text) {
  const chat = document.getElementById('chat');
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.textContent = text;
  // A+B: user 实时回显记账（供增量拉取内容级去重，消除双渲染）
  if (role === 'user') { el.dataset.raw = text; trackRendered('user', text); }
  // P2: 时间戳 — system/error/info/tool 消息显示 HH:MM（用户友好度）
  if (role === 'system' || role === 'error' || role === 'info' || role === 'tool') {
    const t = document.createElement('span');
    t.className = 'msg-time';
    t.textContent = new Date().toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    el.appendChild(t);
  }
  chat.appendChild(el);
  appendAnchor(el);
  scrollToBottomIfSticky();
  return el;   // 修复：返回节点供调用方操作（loading 提示/移除等；原实现返回 undefined 导致 loadingEl 崩溃）
}

// ── 2026-08-23: 长消息折叠 + DOM 裁剪 + 滚动 rAF 节流（渲染性能优化）──
const LONG_MSG_COLLAPSE_CHARS = 4000;   // 正文超过该字符数默认折叠（含展开按钮）
const MAX_CHAT_MSG_NODES = 400;         // #chat 顶层 .msg 节点数上限（超过裁剪顶部旧消息）
const MAX_CHAT_MSG_NODES_KEEP = 320;    // 裁剪到该数量（留余量防频繁裁）

function maybeCollapseLongBody(body, rawLen) {
  if (!body || !rawLen || rawLen <= LONG_MSG_COLLAPSE_CHARS) return;
  if (body.classList.contains('long-collapsed')) return;
  body.classList.add('long-collapsed');
  var btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'long-collapse-toggle';
  btn.textContent = '展开全部（' + rawLen + ' 字符）';
  btn.onclick = function() {
    body.classList.remove('long-collapsed');
    if (btn.parentNode) btn.parentNode.removeChild(btn);
    scrollToBottomIfSticky();
  };
  if (body.parentNode) body.parentNode.insertBefore(btn, body.nextSibling);
}

// 轻量虚拟滚动：贴底且 DOM 超限 → 从顶部移除旧消息，并同步 renderedIds
// （renderOlderBatch 的 minRendered 锚点会按需补渲染，无空洞；用户上卷时不裁剪）
function trimChatDomIfNeeded() {
  const chat = document.getElementById('chat');
  if (!chat) return;
  const msgs = chat.querySelectorAll('.msg');
  if (msgs.length <= MAX_CHAT_MSG_NODES) return;
  if (chat.scrollTop + chat.clientHeight < chat.scrollHeight - 80) return;  // 非贴底不裁
  const c = sessionCache[currentSession];
  var removeCount = msgs.length - MAX_CHAT_MSG_NODES_KEEP;
  for (var i = 0; i < removeCount; i++) {
    var m = msgs[i];
    if (!m.parentNode) continue;
    // 连带删除紧随其前的 meta 行（user 消息的 msg-meta-outside）
    var prev = m.previousSibling;
    if (prev && prev.classList && prev.classList.contains('msg-meta-outside')) prev.remove();
    if (c && m.dataset.id) c.renderedIds.delete(Number(m.dataset.id));
    m.remove();
  }
}

// 滚动 rAF 节流：高频流式 chunk 合并为每帧一次滚底（避免每 chunk 强制 layout）
var _scrollRafPending = false;
function scheduleScrollIfSticky() {
  if (_scrollRafPending) return;
  _scrollRafPending = true;
  const doIt = function() {
    _scrollRafPending = false;
    scrollToBottomIfSticky();
  };
  if (window.requestAnimationFrame) requestAnimationFrame(doIt);
  else setTimeout(doIt, 16);
}

// ── 智能滚动：仅贴底时自动跟随；用户上卷(距底>40px)后流式内容不再强拉到底部 ──
function scrollToBottomIfSticky(force) {
  // 2026-08-12: force 参数已无调用方（实时路径全部改贴底跟随），保留作防御性接口
  if (force) stickToBottom = true;
  if (!stickToBottom) return;
  const chat = document.getElementById('chat');
  if (!chat) return;
  // 2026-08-10 修复: force 时同步立即滚底（读 scrollHeight 强制 reflow，值必然准确）
  // + rAF 补滚（覆盖异步布局/图片加载后的偏移）——原实现仅单次 rAF，
  // 高频流式 chunk 下 rAF 可能被合并/跳过导致滚动丢失（"强制滚底没起作用"根因之一）。
  chat.scrollTop = chat.scrollHeight;
  if (window.requestAnimationFrame) {
    requestAnimationFrame(function() { chat.scrollTop = chat.scrollHeight; });
  }
  trimChatDomIfNeeded();   // 2026-08-23: 贴底时 DOM 超限裁剪（轻量虚拟滚动）
}
// F4a: 强制滚底（同步立即 + rAF 补滚）。用于历史加载完成后——append 后 DOM 已更新，
// 同步赋值 scrollHeight 必然准确；rAF 仅作保险，即使 rAF 失败同步滚动也已生效。
// 不依赖 stickToBottom（加载历史后无条件滚底显示最新消息）。
function forceScrollToBottom() {
  const chat = document.getElementById('chat');
  if (!chat) return;
  // 首次同步立即无条件滚底（DOM 刚更新，scrollHeight 必然准确）。
  // 修复: 原实现 doScroll() 首次调用就被 F8（距底>40px→return）拦截，
  // 因 clearChat 后 scrollTop=0，加载新消息后 scrollHeight-clientHeight 必然>40，
  // 导致切换 session 后消息停在顶部不滚底。
  chat.scrollTop = chat.scrollHeight;
  // F7b: 后续补滚 try-catch——scrollTop 赋值永不抛异常，
  // 保证后续 rAF/setTimeout 补滚必然注册（否则异常会短路整条补滚链）
  const doScroll = function() {
    try {
      // F8: 用户已上卷（距底>40px）→ 停止补滚，尊重用户操作（场景N修复）。
      // 仅 rAF/setTimeout 补滚阶段执行此判断——首次同步已在上方无条件完成。
      if (chat.scrollHeight - chat.scrollTop - chat.clientHeight > 40) return;
      chat.scrollTop = chat.scrollHeight;
    } catch(e) { /* 忽略：任何异常都不允许中断补滚链 */ }
  };
  // ②同步补滚（首次已在上方执行）
  if (window.requestAnimationFrame) {
    requestAnimationFrame(doScroll);   // ②rAF 补滚（下一帧，布局稳定后）
  }
  // F7c: ③-⑧六级递进补滚——覆盖字体/图片/异步资源/浏览器 scroll restoration 任意时机。
  // F7a: 已移除 scrollIntoView（其可能在 fetch 微任务回调抛异常短路补滚链）。
  setTimeout(doScroll, 50);
  setTimeout(doScroll, 200);
  setTimeout(doScroll, 500);
  setTimeout(doScroll, 1000);
  setTimeout(doScroll, 1500);
  setTimeout(doScroll, 2000);
}
function onChatScroll() {
  const chat = document.getElementById('chat');
  const dist = chat.scrollHeight - chat.scrollTop - chat.clientHeight;
  stickToBottom = dist < 40;
  // 滚到顶 → 触发历史消息补渲染（olderTriggered 防抖：只在上次未触发过时执行一次）
  if (chat.scrollTop <= 2 && !olderTriggered) {
    olderTriggered = true;
    renderOlderBatch(currentSession);
  } else if (chat.scrollTop > 2) {
    olderTriggered = false;
  }
  scheduleAnchorHighlight();
  const btn = document.getElementById('back-to-bottom');
  if (btn) btn.classList.toggle('show', dist > 300);
}
function clearChat() {
  const chat = document.getElementById('chat');
  chat.innerHTML = '';
  chat.scrollTop = 0;   // F4b: 重置滚动位置，杜绝浏览器恢复旧位置（刷新后停在顶部）
  resetAnchors();
  lastAssistantEl = null;
  thinkingEl = null;
}

function sendStop() {
  if (ws && ws.readyState === WebSocket.OPEN)
    ws.send(JSON.stringify({type: 'interrupt', session: currentSession || ''}));
}

function interruptSession(name) {
  if (ws && ws.readyState === WebSocket.OPEN)
    ws.send(JSON.stringify({type: 'interrupt', session: name}));
}


// ── 右侧定位锚点：每条用户消息一个 dot，点击跳转；滚动时高亮当前消息 ──
// 2026-09-11 优化（对齐 DeepSeek 风格）：
//   1) 全量保留锚点（原 MAX_ANCHORS=50 移除最旧 → 长会话早期消息失去跳转入口）；
//      数量密集时改由 CSS dense/denser 压缩尺寸与间距；
//   2) 悬停显示消息摘要（原仅"跳到消息 N"）；
//   3) append/滚动后经 rAF 调度刷新高亮（防高频重算 + 新锚点即时高亮）。
let anchorCounter = 0;
function appendAnchor(el) {
  if (!el || !el.classList || !el.classList.contains('msg')) return;
  if (!el.classList.contains('user')) return;   // 只给 user 消息建锚点
  const anchors = document.getElementById('msg-anchors');
  if (!anchors) return;
  const idx = anchorCounter++;
  el.dataset.anchorIdx = idx;
  const dot = document.createElement('div');
  dot.className = 'anchor-dot' + (el.classList.contains('user') ? ' user' : '');
  dot.dataset.idx = idx;   // 稳定标识：与 el.dataset.anchorIdx 对应（updateAnchorHighlight 精确匹配）
  let _txt = (el.textContent || '').trim().replace(/\s+/g, ' ');
  if (_txt.length > 80) _txt = _txt.slice(0, 80) + '…';
  dot.title = '#' + (idx + 1) + (_txt ? (' · ' + _txt) : ' · 跳到该消息');
  dot.onclick = function() {
    el.scrollIntoView({block: 'start', behavior: 'smooth'});
  };
  anchors.appendChild(dot);
  updateAnchorDensity();
  scheduleAnchorHighlight();
}
function jumpToLastUserMsg() {
  const chat = document.getElementById('chat');
  if (!chat) return;
  const users = chat.querySelectorAll('.msg.user');
  if (users.length) {
    users[users.length - 1].scrollIntoView({block: 'start', behavior: 'smooth'});
  }
}
function resetAnchors() {
  anchorCounter = 0;
  const anchors = document.getElementById('msg-anchors');
  if (anchors) {
    anchors.innerHTML = '';
    anchors.classList.remove('dense', 'denser');
  }
}
function updateAnchorHighlight() {
  const chat = document.getElementById('chat');
  const anchors = document.getElementById('msg-anchors');
  if (!chat || !anchors) return;
  const dots = anchors.querySelectorAll('.anchor-dot');
  const msgs = chat.querySelectorAll('.msg.user');
  const st = chat.scrollTop;
  // 视口内最后一条「已滚过顶部」的 user 消息 = 当前所在轮次
  let activePos = -1;     // 位置（用于位置对齐兜底）
  let activeIdx = null;   // 稳定标识（anchorIdx）
  for (let i = 0; i < msgs.length; i++) {
    if (msgs[i].offsetTop - chat.offsetTop <= st + 80) {
      activePos = i;
      if (msgs[i].dataset.anchorIdx != null) activeIdx = msgs[i].dataset.anchorIdx;
    }
  }
  // 定位目标 dot：优先 anchorIdx 精确匹配；未命中（旧 dot 缺失等）回退位置对齐。
  // 2026-09-11 修复：原实现 activeIdx 非空时不做位置兜底——dot 缺失时高亮整体丢失。
  let activeDot = null;
  if (activeIdx != null) {
    for (let k = 0; k < dots.length; k++) {
      if (dots[k].dataset.idx === activeIdx) { activeDot = dots[k]; break; }
    }
  }
  if (!activeDot && activePos >= 0 && dots.length) {
    activeDot = dots[Math.min(activePos, dots.length - 1)];
  }
  for (let k = 0; k < dots.length; k++) {
    dots[k].classList.toggle('active', dots[k] === activeDot);
  }
}

// ── 2026-08-30: 会话级消息排队（busy 时发送 → 后端 FIFO 队列，回合结束自动续跑）──
// queuedItems: 当前视图已确认排队、尚未开始处理的消息 [{qid, text}]（qid 为后端 uuid，精确取消）。
// v1.2: 排队消息不再渲染为消息流中的用户气泡（用户反馈：排队消息混入用户消息区体验差），
//       统一显示在输入框上方 #queue-bar 列表（#N + 文本截断 + ✕ 取消）；
//       消息开始处理（chat_dequeued）时才 addMsg("user", ...) 渲染为真实用户消息。
// pendingBubbles: send()/重放渲染的"待确认"气泡（data-queue-pending 标记 + FIFO 数组），
//       收到 chat_queued（确认排队）时从消息流移除，防止排队消息滞留在用户消息区。
let queuedItems = [];
let pendingBubbles = [];   // [{text, el, ts}] 待确认气泡（FIFO，同文本按发送顺序摘除）

function dropPendingBubble(text) {
  // 从尾部匹配（最近渲染的待确认气泡 = 对应的排队消息；同文本直发残留靠前保留，避免误删历史气泡）
  for (var pb = pendingBubbles.length - 1; pb >= 0; pb--) {
    var pbIt = pendingBubbles[pb];
    if (pbIt.text === text && pbIt.el && pbIt.el.parentNode) {
      pbIt.el.parentNode.removeChild(pbIt.el);
      pendingBubbles.splice(pb, 1);
      return true;
    }
  }
  var chat = document.getElementById('chat');
  if (!chat || text == null) return false;
  var msgs = chat.querySelectorAll('.msg.user[data-queue-pending="1"]');
  for (var mi = msgs.length - 1; mi >= 0; mi--) {
    if (String(msgs[mi].dataset.raw || '') === text) {
      if (msgs[mi].parentNode) msgs[mi].parentNode.removeChild(msgs[mi]);
      return true;
    }
  }
  return false;
}

function hasPendingBubble(text) {
  // 聊天流中是否仍存在待确认标记的该文本气泡（chat_dequeued 防御判断用）
  var chat = document.getElementById('chat');
  if (!chat || text == null) return false;
  var msgs = chat.querySelectorAll('.msg.user[data-queue-pending="1"]');
  for (var mi = msgs.length - 1; mi >= 0; mi--) {
    if (String(msgs[mi].dataset.raw || '') === text) return true;
  }
  return false;
}

function fetchQueueSnapshot() {
  var s = currentSession || '';
  if (!s) return;
  fetch(BASE + 'api/chat/queue?session=' + encodeURIComponent(s))
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (!d || !d.items) return;
      // 2026-09-04 修复：全量重建（以服务端为准）——原实现"只增不减"导致本地悬垂
      // （chat_dequeued/cancelled 事件丢失时服务端已消费但前端残留）。重建保留本地
      // dropped 标记（气泡是否已从消息流移除），新项调用 dropPendingBubble 补算
      // （该函数幂等：气泡已移除时返回 false，重复调用安全）。
      var localByQid = {};
      for (var li = 0; li < queuedItems.length; li++) localByQid[queuedItems[li].qid] = queuedItems[li];
      var newItems = [];
      for (var ri = 0; ri < d.items.length; ri++) {
        var itr = d.items[ri];
        var lr = localByQid[itr.qid];
        newItems.push({qid: itr.qid, text: itr.text,
          dropped: lr ? !!lr.dropped : dropPendingBubble(itr.text)});
      }
      queuedItems = newItems;   // 服务端没有的本地项自然移除（悬垂消除）
      renderQueueItems();
    })
    .catch(function() {});
}

function send() {
  if (sessionSwitchPending) {
    addMsg('info', '⏳ 正在切换会话，请稍候…');
    return;
  }
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;
  // 2026-08-30: 处理中发送不再拦截 → 后端 busy 时入会话级 FIFO 队列并回 chat_queued，
  // 回合结束自动续跑；是否排队由后端判定（避免前端竞态），前端按确认显示徽标
  input.value = '';

  // ── 输入历史：内存入队（末尾去重，对齐 repl._add_history）+ 异步写回后端 ──
  if (text && (inputHistory.length === 0 || inputHistory[inputHistory.length - 1] !== text)) {
    inputHistory.push(text);
  }
  histIdx = -1;    // 提交后重置浏览游标（对齐 repl: 新输入从最新历史重新开始）
  histDraft = '';
  fetch(BASE + 'api/history', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({text: text})
  }).catch(() => {});   // 写回失败不阻塞发送（历史仅尽力持久化）
  input.style.height = 'auto';

  stickToBottom = true;   // 用户主动发送 → 恢复贴底跟随
  var userEl = addMsg('user', text);
  userEl.dataset.queuePending = '1';   // v1.2: 待确认标记（确认排队后从消息流移除）
  pendingBubbles.push({text: text, el: userEl, ts: Date.now()});   // FIFO：同文本按发送顺序摘除
  if (pendingBubbles.length > 50) pendingBubbles.shift();   // 数组上限兜底（极端连续发送）
  // 修复（2026-08-23）：用户消息实时发送时也入 pendingLive 缓冲，
  // 切回正在执行的 session 时由 replayPendingLive 在 LLM 回复之前重放，
  // 避免 fetchIncremental 追加渲染导致用户消息插入到 LLM 回复中间/之后。
  if (sessionCache[currentSession]) {
    var plUser = ensurePendingLive(currentSession);
    plUser.push({type: 'user', data: text, session: currentSession});
  }
  lastUserMsgTs = new Date().toISOString();   // 2026-08-10: 记录实时发送时间（耗时提示基准）
  finalizeTextEl();

  if (ws && ws.readyState === WebSocket.OPEN) {
    if (text.startsWith('!') || text.startsWith('/')) {
      ws.send(JSON.stringify({type: 'command', cmd: text, session: currentSession || ''}));
    } else {
      ws.send(JSON.stringify({type: 'chat', text: text, session: currentSession || ''}));
    }
  } else {
    // P0 修复：断线时普通消息入队（重连后自动 flush），命令消息提示暂不可用
    if (text.startsWith('!') || text.startsWith('/')) {
      addMsg('error', '❌ 离线中，命令暂不可用（重连后重试）');
    } else {
      pendingQueue.push(text);
      addMsg('info', '⏳ 离线中，消息已排队，重连后自动发送');
    }
    connect();
  }
  input.focus();               // 4B: 发送后自动聚焦
}

const IMAGE_EXTS = ['.png', '.jpg', '.jpeg', '.gif', '.webp', '.bmp', '.svg', '.ico'];
function formatSize(n) {
  if (n < 1024) return n + ' B';

async function uploadFiles(input) {
  const files = input.files;
  if (!files || files.length === 0) return;
  for (let i = 0; i < files.length; i++) {
    const fd = new FormData();
    fd.append('file', files[i]);
    addMsg('info', '⏳ 上传中: ' + files[i].name);
    try {
      const resp = await fetch(BASE + 'api/upload?session=' + encodeURIComponent(currentSession || ''), {method: 'POST', body: fd});
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok || !data.ok) {
        addMsg('error', '❌ 上传失败: ' + (data.detail || data.error || ('HTTP ' + resp.status)));
        continue;
      }
      const inputEl = document.getElementById('input');
      const sep = (inputEl.value && !inputEl.value.endsWith(' ')) ? ' ' : '';
      inputEl.value += sep + data.path;
      inputEl.style.height = 'auto';
      const msgEl = addMsg('tool', '📎 已上传: ' + data.path + ' (' + formatSize(data.size) + (data.is_image ? ', 图片' : '') + ')');
      const link = document.createElement('a');
      link.href = BASE + data.url;
      link.target = '_blank';
      link.textContent = ' 打开';
      link.style.marginLeft = '8px';
      msgEl.appendChild(link);
      if (data.is_image) {
        const img = document.createElement('img');
        img.onerror = function () { mdImgError(this); };
        img.src = BASE + data.url;
        img.style.maxWidth = '180px'; img.style.maxHeight = '120px';
        img.style.borderRadius = '8px'; img.style.marginTop = '4px';
        img.style.cursor = 'pointer';
        img.onclick = function() { window.open(BASE + data.url); };
        msgEl.appendChild(img);
      }
    } catch (e) {
      addMsg('error', '❌ 上传异常: ' + e.message);
    }
  }
  input.value = '';
}

let sessionPrevBusy = {};   // session -> 上一轮是否忙（llm/in_tool），用于忙→闲检测
let pendingSessions = {};   // session -> true：回合已完成、等待用户查看
let lastSessionsSig = '';   // 上次渲染签名（防轮询闪烁）
let lastUserMsgTs = null;    // 最后一条 user 消息时间（assistant 耗时提示基准）
let recentOrder = [];       // MRU：最近选中的 session 在前（running 块按此排序，需求2）
let sessionFilter = '';        // 新建输入框实时搜索词（空 = 显示全部；输入即搜索，不点加号不新建）
