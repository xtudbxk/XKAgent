function touchRecent(name) {
  // MRU 置顶：name 移到数组头部，其余保持原顺序（V8 稳定）
  recentOrder = [name, ...recentOrder.filter(x => x !== name)];
}

function renderSessionList(data) {
    const list = document.getElementById('session-list');
    list.innerHTML = '';
    // 对齐 repl /sessions：running 置顶，其余用分隔标题隔开
    // 2026-09-11 修复：拆分「存活」与「活跃」两个判定——
    //   isAlive ：agent 线程存活（含空闲）→ 绿点/停止按钮（原 isRunning 宽口径）
    //   isActive：真正在跑（回合活跃/转发/排队/启动中）→ 分区置顶
    //   （修复：空闲 agent 不再被置顶进 running 区；对齐「running=在跑」预期）
    const isAlive = s => data.agents && data.agents[s] && data.agents[s].status === 'running';
    const isActive = s => {
      const ag = data.agents && data.agents[s];
      if (!ag || ag.status !== 'running') return false;
      return ag.turn_active === true
          || ag.chat_forward_busy === true
          || (ag.queue_count || 0) > 0
          || ag.phase === 'llm'
          || ag.phase === 'starting'
          || ag.in_tool === true;
    };
    const q = sessionFilter.trim().toLowerCase();
    // 2026-09-07: subagent 识别（callagent fanout 命名 <父>_subagent_<角色>_<时间戳>，含旧式 subagent_t*）
    const isSubagent = s => s.includes('_subagent_') || s.startsWith('subagent_');
    const showSub = document.getElementById('show-subagents').checked;
    // 2026-09-08: 搜索匹配对所有会话生效；subagent 隐藏仅作用于非活跃列表
    // （2026-09-11 注：活跃区始终显示；空闲/其他区受 subagent 开关约束）
    const match = s => {
      if (!q) return true;
      if (s.toLowerCase().includes(q)) return true;
      const t = (data.titles && data.titles[s]) || '';
      return t.toLowerCase().includes(q);
    };
    const matchOthers = s => match(s) && (showSub || !isSubagent(s));
    // 2026-09-10: 置顶分区——data.pins 来自 /api/sessions（registry pinned 字段，最近置顶在前）。
    // 已置顶会话从 running/others 分区移出（仅置顶区渲染一次，避免重复）；
    // 显式置顶优先于 subagent 隐藏开关（仍受搜索词过滤）。
    const pinsAll = data.pins || [];
    const pinnedSet = {};
    pinsAll.forEach(s => { pinnedSet[s] = true; });
    const pinnedVisible = pinsAll.filter(s => data.sessions.indexOf(s) !== -1 && match(s));
    // 活跃区（真正在跑）——置顶显示（保留变量名 running 以减小改动面）
    const running = data.sessions.filter(s => isActive(s) && match(s) && !pinnedSet[s]);
    // 需求2：running 块按 MRU（最近选中）排序——当前选中第 1，上一次选中的第 2，以此类推
    // recentOrder 前端实时维护，不受后端 2s TTL 缓存影响；未在 MRU 的 session 稳定排序兜底置后
    const mruIdx = s => { const i = recentOrder.indexOf(s); return i === -1 ? 999 : i; };
    running.sort((a, b) => mruIdx(a) - mruIdx(b));
    // 空闲区（agent 存活但无活跃回合）：2026-09-11 新增——从原 running 区拆出，不置顶
    const idleAlive = data.sessions.filter(s => isAlive(s) && !isActive(s) && matchOthers(s) && !pinnedSet[s]);
    const others = data.sessions.filter(s => !isAlive(s) && matchOthers(s) && !pinnedSet[s]);
    const renderItem = s => {
      const el = document.createElement('div');
      const activeName = currentSession || data.current;
      el.className = 'session-item' + (s === activeName ? ' active' : '');
      // 对齐 repl /sessions 的 [running] 标记：agent 存活的会话前加绿色圆点
      if (isAlive(s)) {
        const dot = document.createElement('span');
        dot.className = 'session-status-dot';
        dot.textContent = '●';
        el.appendChild(dot);
      }
      // 会话名（独立 span，避免后续 textContent 清空徽标导致样式丢失）
      el.dataset.session = s;   // 权威标识：active 判定/点击回读都用 name，不受 title 展示影响
      const nameSpan = document.createElement('span');
      nameSpan.className = 'session-name-text';
      // 2026-09-10: 主文本优先显示 title（展示名），未设置回退 name
      const _title = (data.titles && data.titles[s] && data.titles[s] !== s) ? data.titles[s] : '';
      nameSpan.textContent = _title || s;
      nameSpan.title = (data.workdirs && data.workdirs[s])
        ? (s + ' · ' + data.workdirs[s]) : s;
      el.appendChild(nameSpan);
      if (_title) {   // 有自定义标题时附 name 小字，便于寻址/排查
        const subSpan = document.createElement('span');
        subSpan.className = 'session-name-sub';
        subSpan.textContent = s;
        el.appendChild(subSpan);
      }
      // 对齐 repl /sessions 的 🔒：他进程持锁时追加锁标记
      const lockTag = data.lock_tags && data.lock_tags[s];
      if (lockTag) {
        const lockSpan = document.createElement('span');
        lockSpan.className = 'session-lock-tag';
        lockSpan.textContent = ' ' + lockTag;
        el.appendChild(lockSpan);
      }

      // 对齐 repl /sessions 的 phase/in_tool 徽标：llm处理中⏳ / tool执行中🔧 / 初始化⏳starting（空闲不加）
      const ag = data.agents && data.agents[s];
      if (ag) {
        let phaseTag = "";
        if (ag.in_tool) phaseTag = "🔧tool";
        else if (ag.phase === "llm") phaseTag = "⏳llm";
        else if (ag.phase === "starting") phaseTag = "⏳starting";
        if (phaseTag) {
          const phaseSpan = document.createElement("span");
          phaseSpan.className = "session-phase-tag";
          phaseSpan.textContent = " " + phaseTag;
          el.appendChild(phaseSpan);
        }
        // 活跃会话显示 mode 徽标（复用输入框 modeLabel；空闲不占位——2026-09-11 修正判定口径）
        if (isActive(s) && ag.mode) {
          const modeSpan = document.createElement("span");
          modeSpan.className = "session-mode-tag";
          modeSpan.textContent = " " + modeLabel(ag.mode);
          el.appendChild(modeSpan);
        }
      }
      // 崩溃符号：crashed 状态或 crash_notices 未 ack（崩溃过）都显示
      const cn = data.crash_notices && data.crash_notices[s];
      if ((ag && ag.status === 'crashed') || cn) {
        const crashSpan = document.createElement('span');
        crashSpan.className = 'session-crash-tag';
        crashSpan.textContent = ' 🔴crashed';
        crashSpan.title = '崩溃时间: ' + (cn ? cn.time : '') + '\n' + (cn ? (cn.error || '') : (ag && ag.error ? ag.error : ''));
        el.appendChild(crashSpan);
      }
      // 需求1：🔔 待查看 徽标（非当前 session 回合完成后提示用户查看）
      if (pendingSessions[s]) {
        const pendSpan = document.createElement('span');
        pendSpan.className = 'session-pending-tag';
        pendSpan.textContent = ' 🔔待查看';
        el.appendChild(pendSpan);
      }
      // 2026-09-04 修复：排队消息徽标（跨 session 可见——切走后该 session 排队中仍提示）
      if (ag && ag.queue_count > 0) {
        const qSpan = document.createElement('span');
        qSpan.className = 'session-queue-tag';
        qSpan.textContent = ' ⏳' + ag.queue_count;
        qSpan.title = '有 ' + ag.queue_count + ' 条消息排队等待处理（回合结束后依次处理）';
        el.appendChild(qSpan);
      }
      el.onclick = () => switchSession(s);
      // 面板 stop 按钮：停止存活会话的 agent 线程（保留数据，切换时自动恢复）。
      // 所有存活（agent 运行中）会话（含当前）均显示；当前会话停止后自动切换到列表最靠前的
      // 其他会话（后端已切 focus 并返回 switched_to，避免 focus 置空失焦）。
      // 他进程持锁的会话不在本进程 agents 中 → isAlive=false → 天然不显示，
      // 不会误停他人持有的会话。
      // ── fork 快捷按钮：复制该会话为副本（所有 session 显示，hover 可见）──
      const forkBtn = document.createElement('button');
      forkBtn.className = 'session-fork';
      forkBtn.textContent = '\u29c9';
      forkBtn.title = '复制会话（fork）';
      forkBtn.onclick = function(ev) {
        ev.stopPropagation();
        const target = prompt('复制会话 "' + s + '" 为新会话名:', s + '_copy');
        if (!target) return;
        fetch(BASE + 'api/sessions/' + encodeURIComponent(s) + '/fork', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({target: target})
        })
          .then(function(r) { return r.json().then(function(d) { return {ok: r.ok, data: d}; }); })
          .then(function(res) {
            if (!res.ok) { alert('Fork 失败: ' + ((res.data && res.data.detail) || res.status)); return; }
            fetchSessions();   // 刷新列表，新 session 出现
          })
          .catch(function(e) { alert('Fork 失败: ' + e.message); });
      };
      el.appendChild(forkBtn);
      // ── 置顶按钮：固定显示在列表顶部（hover 可见；已置顶常显；点击切换）──
      const isPinned = !!pinnedSet[s];
      const pinBtn = document.createElement('button');
      pinBtn.className = 'session-pin' + (isPinned ? ' pinned' : '');
      pinBtn.textContent = '📌';
      pinBtn.title = isPinned ? '取消置顶' : '置顶（固定显示在列表顶部）';
      pinBtn.onclick = function(ev) {
        ev.stopPropagation();
        togglePin(s, !isPinned);
      };
      el.appendChild(pinBtn);
      if (sessionIsBusy(data.agents, s)) {
        const intrBtn = document.createElement('button');
        intrBtn.className = 'session-interrupt';
        intrBtn.textContent = '⏸';
        intrBtn.title = '中断当前回合（不停止 agent 线程）';
        intrBtn.onclick = function(ev) {
          ev.stopPropagation();
          interruptSession(s);
        };
        el.appendChild(intrBtn);
      }
      if (isAlive(s)) {
        const stopBtn = document.createElement('button');
        stopBtn.className = 'session-stop';
        stopBtn.textContent = '⏹';
        stopBtn.title = (s === data.current)
          ? '停止当前会话（保留数据，自动切换到下一个会话）'
          : '停止会话（保留数据，切换时自动恢复）';
        stopBtn.onclick = function(ev) {
          ev.stopPropagation();
          fetch(BASE + 'api/sessions/' + encodeURIComponent(s) + '/stop', {method: 'POST'})
            .then(function(r) { return r.json().then(function(d) { return {ok: r.ok, data: d}; }); })
            .then(function(res) {
              if (!res.ok) { alert('停止失败: ' + res.status); return; }
              if (s === currentSession) {
                // 停止的是当前会话
                if (res.data && res.data.switched_to) {
                  switchSession(res.data.switched_to);   // WS 幂等重切 + 乐观高亮 + session_switched 刷新
                } else {
                  // 无其他会话可切：线程已停不会再有 done，复位流式状态
                  isStreaming = false;
                  setStopBtnVisible(false);
                  queuedItems = [];   // 2026-08-30: 会话已停止 → 清空排队视图（后端已随 stop 清队列）
                  renderQueueItems();   // 内部已调用 updateQueueBar()
                  fetchSessions();
                }
              } else {
                fetchSessions();
              }
            })
            .catch(function(e) { alert('停止失败: ' + e.message); });
        };
        el.appendChild(stopBtn);
      }
      list.appendChild(el);
    };
    // 2026-09-10: 置顶分区（列表最顶部；已置顶会话不再出现在 running/others 分区）
    if (pinnedVisible.length) {
      const psep = document.createElement('div');
      psep.className = 'session-divider';
      psep.textContent = '📌 置顶';
      list.appendChild(psep);
      pinnedVisible.forEach(renderItem);
    }
    running.forEach(renderItem);
    if (idleAlive.length) {
      // 2026-09-11：空闲区（agent 存活、无活跃回合）——从原 running 区拆出独立标题
      const isep = document.createElement('div');
      isep.className = 'session-divider';
      isep.textContent = 'Idle sessions';
      list.appendChild(isep);
      idleAlive.forEach(renderItem);
    }
    if (others.length) {
      const sep = document.createElement('div');
      sep.className = 'session-divider';
      sep.textContent = 'Other sessions (not running)';
      list.appendChild(sep);
      others.forEach(renderItem);
    }
    // 空结果提示（原实现嵌套在 others 分支内、条件恒假不可达 → 修正为独立判断）
    if (q && pinnedVisible.length === 0 && running.length === 0 && idleAlive.length === 0 && others.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'session-empty';
      empty.textContent = '无匹配的 session: ' + sessionFilter.trim();
      list.appendChild(empty);
    }
    if (data.current && !sessionSwitchPending) {
      currentSession = data.current;
      document.getElementById('session-name').textContent = currentSession;
    }

}

function togglePin(name, willPin) {
  // 2026-09-10: 置顶切换——等服务端权威返回后立即重渲染（不等 2s 轮询）；失败弹窗
  fetch(BASE + 'api/sessions/' + encodeURIComponent(name) + '/pin', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({pinned: !!willPin})
  })
    .then(function(r) { return r.json().then(function(d) { return {ok: r.ok, data: d}; }); })
    .then(function(res) {
      if (!res.ok) { alert('置顶失败: ' + ((res.data && res.data.detail) || res.status)); return; }
      if (lastSessionsData) {
        lastSessionsData.pins = (res.data && res.data.pins) || [];
        renderSessionList(lastSessionsData);   // 立即反馈置顶/取消置顶后的新顺序
      }
      fetchSessions();
    })
    .catch(function(e) { alert('置顶失败: ' + e.message); });
}

function fetchSessions() {
  fetch(BASE + 'api/sessions').then(r => r.json()).then(data => {
    // 忙→闲检测：非当前 session 回合完成 → 标记待查看
    // busy = llm 处理中 或 tool 执行中（starting 初始化不算回合执行，避免误标）
    const isBusy = s => sessionIsBusy(data.agents, s);
    data.sessions.forEach(s => {
      const ag = data.agents && data.agents[s];
      const busy = isBusy(s);
      const idleNow = !!ag && ag.status === 'running' && !busy;  // 仍在运行但已空闲 = 回合完成（基于 turn_active）
      if (sessionPrevBusy[s] === true && idleNow && s !== (currentSession || data.current)) {
        pendingSessions[s] = true;   // 忙→闲 且非当前 → 待查看
      }
      sessionPrevBusy[s] = busy;
    });
    // 首次加载：用后端顺序初始化 MRU（current 置前），避免 recentOrder 为空
    if (recentOrder.length === 0 && data.sessions.length > 0) {
      recentOrder = [data.current, ...data.sessions.filter(s => s !== data.current)];
    }
    // 兜底校准（2026-08-12）：每次轮询响应都先同步 Send/Stop 按钮状态（口径与后端
    // _session_busy 一致：status==='running' && turn_active）。必须在 sig 短路之前执行——
    // 切走/刷新/断线后 done 丢失导致 isStreaming 卡 True，即使 agents 数据未变
    // （回合完成后 turn_active 复位为 false 但被 10s 低频轮询拖慢），按钮也要尽快恢复。
    var syncSession = currentSession || data.current;
    if (syncSession) {
      const busyNow = sessionIsBusy(data.agents, syncSession);
      if (busyNow !== isStreaming) {
        isStreaming = busyNow;
        setStopBtnVisible(busyNow);
      }
    }
    // 2026-09-04 修复：随 2s 轮询顺带同步排队视图（chat_queued/dequeued 事件丢失时兜底）
    fetchQueueSnapshot();
    // 当前会话不在流式执行时，每轮轮询都补拉 DB 增量；不能被侧边栏签名短路。
    var pollSession = currentSession || data.current;
    var pollCache = sessionCache[pollSession];
    var pollAgent = data.agents && data.agents[pollSession];
    if (pollCache && pollCache.ids && pollCache.ids.size && (!pollAgent || pollAgent.turn_active !== true)) {
      // 轮询冷却（2026-08-22）：上次增量无新消息 → 冷却期内跳过，避免每 2s 重复请求空结果。
      if (!pollCache._noNewUntil || Date.now() >= pollCache._noNewUntil) {
        fetchIncremental(pollSession, pollCache, loadToken, null);
      }
    }
    // 签名比较：sessions/current/agents/lock_tags/pending/recentOrder 均未变则跳过重渲染（防轮询闪烁）
    lastSessionsData = data;
    sessionTitles = data.titles || {};   // 2026-09-10: 标题随列表下发，编辑框零额外请求同步
    updateSessionTitleBox();
    const sig = JSON.stringify([data.sessions, data.current, data.agents, data.lock_tags, pendingSessions, recentOrder, data.titles, data.pins]);
    if (sig === lastSessionsSig) return;
    lastSessionsSig = sig;
    renderSessionList(data);
    updateSessionTitleBox();   // renderSessionList 内可能已赋值 currentSession，补刷标题框
  }).catch(function(err) {
    // 会话列表加载失败不阻塞页面：仅记录，避免未捕获异常中断后续初始化
    console.error('fetchSessions error:', err);
  });
}

function switchSession(name) {
  // 切走正在流式的 session 时立即释放输入（session_switched.busy 会再校正 Stop 态）
  isStreaming = false;
  setStopBtnVisible(false);
  if (ws && ws.readyState === WebSocket.OPEN) {
    armSessionSwitchPending(name);
    ws.send(JSON.stringify({type: 'switch_session', session: name}));
  } else {
    clearSessionSwitchPending();
    fetchSessions();  // 离线：WS 不可用时仅靠 2s 轮询刷新（权威切换需 WS 往返）
  }
  delete pendingSessions[name];  // 用户已查看该会话：清除待查看标记
  // ── 崩溃通知自动 ack：切换到该 session 即视为已查看 → 徽标消失（对齐待查看模式） ──
  // 仅清理前端侧边栏徽标（_crash_notices.acked=true），不影响 agent 运行状态。
  fetch(BASE + 'api/sessions/' + encodeURIComponent(name) + '/crash/ack', {method: 'POST'}).catch(function(){});
  touchRecent(name);  // 需求2：更新 MRU 顺序（当前选中置顶，上次选中排第 2）
  // ── 乐观高亮：立即更新 current 与标题，并加载消息（不等 WS 往返，防 DOM 竞态）──
  currentSession = name;
  document.getElementById('session-name').textContent = name;
  updateSessionTitleBox();
  loadSessionMessages(name);
  document.querySelectorAll('.session-item').forEach(function(el) {
    // 用 dataset.session（name）判定 active——主文本已是 title，不能再比对 textContent
    const sess = el.dataset ? el.dataset.session : '';
    const n = el.querySelector('.session-name-text');
    el.classList.toggle('active', sess ? sess === name : (!!n && n.textContent === name));
  });
  // 移动端切会话后收起边栏
  if (window.innerWidth < 768) document.body.classList.add('sidebar-collapsed');
  // 移除立即 fetchSessions：WS 已连接时权威刷新由后端 session_switched 分支完成
  // （后端已清 sessions 缓存，返回最新 current）；此处立即请求会命中 stale 缓存并覆盖乐观高亮
}
function showSessionError(msg) {
  const panel = document.getElementById('sidebar');
  let err = document.getElementById('session-create-error');
  if (!msg) {
    if (err) err.remove();
    return;
  }
  if (!err) {
    err = document.createElement('div');
    err.id = 'session-create-error';
    err.style.cssText = 'color:var(--err);font-size:12px;margin:0 0 8px 0;';
    const row = panel.querySelector('.session-input-row');
    panel.insertBefore(err, row);
  }
  err.textContent = msg;
}

// title 是纯展示属性（后端 registry 存储，支持中文），session name 仍是唯一寻址标识。
function sessionDisplayTitle(name) {
  const t = (sessionTitles && sessionTitles[name]) || '';
  return (t && t !== name) ? t : '';   // 未设置时返回 ''（展示回退 name）
}
function updateSessionTitleBox() {
  const box = document.getElementById('session-title');
  if (!box) return;

  if (!name) { box.value = ''; box.disabled = true; box.placeholder = '未选择会话'; return; }
  box.disabled = false;
  box.value = sessionDisplayTitle(name);
  box.placeholder = '标题（未设置 → 显示 ' + name + '）';
}
function onSessionTitleKeydown(e) {
  if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); }
  else if (e.key === 'Escape') { updateSessionTitleBox(); e.target.blur(); }
}
function saveSessionTitle() {
  const box = document.getElementById('session-title');
  if (!box || !currentSession || box.disabled) return;
  const before = sessionDisplayTitle(currentSession);
  const after = box.value.trim();
  if (after === before) { updateSessionTitleBox(); return; }   // 无变化：不打扰后端
  fetch(BASE + 'api/sessions/' + encodeURIComponent(currentSession) + '/title', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({title: after})
  }).then(r => r.ok ? r.json() : r.json().then(d => { throw new Error(d.detail || '保存失败'); }))
    .then(data => {
      sessionTitles[currentSession] = data.title || currentSession;
      updateSessionTitleBox();
      lastSessionsSig = '';   // 强制下次轮询重建列表（标题变化需反映到侧边栏）
      fetchSessions();
    })
    .catch(err => { alert('❌ 标题保存失败: ' + err.message); updateSessionTitleBox(); });
}

function createSession() {
  const name = document.getElementById('new-session-name').value.trim();
  const workdir = document.getElementById('new-session-workdir').value.trim();
  if (!name) {
    showSessionError('请输入 session 名称');
    return;
  }
  fetch(BASE + 'api/sessions', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name, workdir: workdir || null})})
    .then(r => {
      if (!r.ok) {
        return r.json().then(data => { throw new Error(data.detail || '创建失败'); });
      }
      return r.json();
    })
    .then(() => {
      showSessionError('');
      sessionFilter = '';   // 新建成功后清空搜索词，列表恢复全量
      document.getElementById('new-session-name').value = '';
      document.getElementById('new-session-workdir').value = '';
      if (window.innerWidth < 768) document.body.classList.add('sidebar-collapsed');
      touchRecent(name);  // 需求2：新创建的 session 置顶
      fetchSessions();  // 刷新列表（新 session 出现）
      switchSession(name);  // 与侧边栏切换同路径：乐观 load + pending + WS switch
    })
    .catch(err => showSessionError('❌ ' + err.message));
}

const RENDER_TAIL_COUNT = 20;   // P2: 10→20 条，首屏上下文更充足（现代浏览器渲染成本可控）   // 历史加载只渲染最新 N 条"可见"消息（正文+tool/command，2026-08-05），更早的通过顶部按钮按需补渲染

// 2026-08-05: 用户要求历史渲染包含 tool 执行/结果及 /xxx、!xxx 命令与结果。
// 后端已过滤 git/compact/drop 内部角色，到前端的消息全部需要渲染，恒返回 true。
// 保留函数签名：后续如需按类型选择性渲染，仅需在此调整。
function isVisibleMsg(m) {
  return true;
}

// 从 msgs（按 id 升序）取最新 n 条可见消息，保持原顺序（旧→新）返回。
// 设计：历史消息可能上千条，全量渲染代价高；只取尾部最新 n 条保证首屏秒开，
// 更早的由用户点击"加载更早"再补渲染（renderOlderBatch）。
function lastVisibleTail(msgs, n) {
  var tail = [];
  for (var i = msgs.length - 1; i >= 0 && tail.length < n; i--) {
    if (isVisibleMsg(msgs[i])) tail.unshift(msgs[i]);
  }
  return tail;
}

// 顶部"加载更早"按钮：历史只渲染最新 RENDER_TAIL_COUNT 条正文，点击补渲染更早的一批
function ensureOlderButton() {
  var btn = document.getElementById('older-btn');
  if (!btn) {
    btn = document.createElement('button');
    btn.id = 'older-btn';
    btn.type = 'button';
    btn.textContent = '⬆ 加载更早的消息';
    btn.onclick = function() { renderOlderBatch(currentSession); };
  }
  var chat = document.getElementById('chat');
  if (btn.parentNode !== chat) chat.insertBefore(btn, chat.firstChild);
  updateOlderButton();
  return btn;
}
function updateOlderButton() {
  var btn = document.getElementById('older-btn');
  if (!btn) return;
  var cached = sessionCache[currentSession];
  if (cached && cached.messages && cached.renderedIds) {
    // 剩余未渲染数：有后端 total（全量可见消息数）用 total - renderedIds.size
    // （支持跨 compact 完整历史）；否则回退缓存内未渲染数（兼容无 total 的增量缓存）
    var remaining;
    if (cached.total !== undefined && cached.total > 0) {
      remaining = Math.max(0, cached.total - cached.renderedIds.size);
      if (remaining === 0 && cached.hasMore === false) { btn.style.display = 'none'; return; }
    } else {
      remaining = cached.messages.filter(function(m) {
        return isVisibleMsg(m) && !cached.renderedIds.has(m._id);
      }).length;
    }
    if (remaining > 0 || cached.hasMore) {
      btn.textContent = '⬆ 加载更早的消息（还有 ' + remaining + ' 条）';
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  } else {
    btn.style.display = 'none';
  }
}

// 历史消息中的 tool_call / tool_result / command 折叠框渲染（2026-08-05 新增）。
// 设计：历史数据的字段结构（displayType + toolCalls/content/result）与流式
// appendToolBox 的 data 结构（{name,args,index,total}/{exit_code,stdout,stderr}）
// 不同，故独立实现，不复用 appendToolBox，避免字段错位。
// 渲染风格与流式保持一致（.msg.tool 折叠框），默认收起、点开看详情。
function renderToolHistory(msg, chat) {
  var produced = [];
  var dt = msg.displayType;

  if (dt === 'tool_call') {
    // 统一渲染核心：与实时 appendToolBox 共用 buildToolBox（static 模式默认收起）
    var built = buildToolBox(msg, 'tool_call', { mode: 'static' });
    chat.appendChild(built.el);
    produced.push(built.el);
    return produced;
  }

  if (dt === 'tool_result') {
    // 统一渲染核心：与实时 appendToolBox 共用 buildToolBox（static 模式按内容折叠/summary 展开）
    var built = buildToolBox(msg, 'tool_result', { mode: 'static' });
    chat.appendChild(built.el);
    produced.push(built.el);
    return produced;
  }

  if (dt === 'thinking') {
    // 统一渲染核心：与实时 ensureThinkingEl 共用 buildThinkingEl（static 模式默认收起）
    var built = buildThinkingEl(msg, { mode: 'static' });
    chat.appendChild(built.el);
    produced.push(built.el);
    return produced;
  }

  // command: /xxx 或 !xxx —— 拆成两个节点（与实时路径一致）：
  //   ① 命令原文 → .msg.user（user 输入，参与锚点）
  //   ② 命令结果 → .msg.tool 折叠框（有 result 时才渲染）
  var userEl = document.createElement('div');
  userEl.className = 'msg user';
  var contentDiv = document.createElement('div');
  contentDiv.textContent = msg.content || '';
  userEl.appendChild(contentDiv);
    userEl.dataset.raw = msg.content || '';
  var tSpan = document.createElement('span');
  tSpan.className = 'msg-time';
  tSpan.textContent = fmtTimeSuffix(msg.created_at);
  userEl.appendChild(tSpan);
  chat.appendChild(userEl);
  appendAnchor(userEl);   // 修复：历史命令原文是 user 输入，补建锚点（与实时 addMsg('user') 一致）
  produced.push(userEl);

  var tag = msg.kind === 'bang' ? '💻' : '🔧';
  var status = '';
  if (msg.ok === false) status = ' ❌';
  else if (msg.exit_code !== undefined && msg.exit_code !== null && msg.exit_code !== 0) status = ' (exit=' + msg.exit_code + ')';
  if (msg.result) {
    var el3 = document.createElement('div');
    el3.className = 'msg tool';
    var details3 = document.createElement('details');
    details3.open = false; // 默认收起，点开看详情
    var summary3 = document.createElement('summary');
    summary3.textContent = tag + ' 命令结果' + status + fmtTimeSuffix(msg.created_at);
    details3.appendChild(summary3);
    var pre3 = document.createElement('pre');
    pre3.textContent = msg.result;
    details3.appendChild(pre3);
    el3.appendChild(details3);
    chat.appendChild(el3);
    produced.push(el3);
  }
  return produced;
}


// ── 单一渲染核心（2026-08-20 合并）：实时 WS 与历史共用同一套 DOM 构建 ──
// 统一消息对象协议 {role, displayType, content, toolCalls, created_at, _id, ...}
// buildAssistantEl / buildThinkingEl / buildToolBox 是实时与历史共用的唯一 DOM 构建点，
// 消灭双轨制（原实时 appendStreaming/appendThinking/appendToolBox 与历史 renderToolHistory
// 各自维护一套 DOM 构建，导致字段错位类 bug）。
// opts.mode: 'stream'=实时（建容器，流式填充，finalize 再 markdown / 执行中展开）；
//            'static'=历史/一次性（立即 markdown 渲染 / 按内容折叠）。

function buildAssistantEl(msg, opts) {
  opts = opts || {};
  var el = document.createElement('div');
  el.className = 'msg assistant';
  el.dataset.raw = msg.content || '';
  if (msg && msg._id) el.dataset.id = msg._id;
  el.dataset.mode = getDefaultViewMode();
  el.dataset.finalized = (opts.mode === 'stream') ? 'false' : 'true';
  var head = document.createElement('div');
  head.className = 'msg-head';
  var btn = document.createElement('button');
  btn.className = 'view-toggle';
  btn.type = 'button';
  btn.textContent = el.dataset.mode === 'text' ? 'TXT' : 'CODE';
  btn.onclick = function() { toggleMsgView(el); };
  head.appendChild(btn);
  var tspan = document.createElement('span');
  tspan.className = 'msg-time';
  tspan.textContent = (opts.mode === 'stream')
    ? new Date().toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'})
    : ((msg.created_at && formatClockTs(msg.created_at)) || new Date().toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'}));
  head.appendChild(tspan);
  if (opts.mode !== 'stream' && msg.created_at && lastUserMsgTs) {
    var latStr = formatLatency(lastUserMsgTs, msg.created_at || new Date().toISOString());
    if (latStr) {
      var latSpan = document.createElement('span');
      latSpan.className = 'msg-latency';
      latSpan.textContent = '⏱ ' + latStr;
      head.appendChild(latSpan);
    }
  }
  el.appendChild(head);
  var body = document.createElement('div');
  body.className = el.dataset.mode === 'text' ? 'md-body' : 'code-body';
  el.appendChild(body);
  if (opts.mode !== 'stream') {
    if (el.dataset.mode === 'text') { body.innerHTML = mdToHtml(el.dataset.raw); linkifyFilePaths(body); runMermaid(body); }
    else { body.textContent = el.dataset.raw; }
    maybeCollapseLongBody(body, el.dataset.raw.length);   // 2026-08-23: 超长正文默认折叠
  }
  return { el: el, body: body };
}

function buildThinkingEl(msg, opts) {
  opts = opts || {};
  var el = document.createElement('div');
  el.className = 'msg thinking-box';
  el.dataset.finalized = (opts.mode === 'stream') ? 'false' : 'true';
  var details = document.createElement('details');
  details.open = (opts.mode === 'stream') ? true : false;
  var summary = document.createElement('summary');
  summary.textContent = '🧠 Thinking' + (msg.created_at ? fmtTimeSuffix(msg.created_at) : fmtTimeSuffix());
  var pre = document.createElement('pre');
  pre.className = 'thinking-content';
  pre.textContent = msg.content || '';
  details.appendChild(summary);
  details.appendChild(pre);
  el.appendChild(details);
  return { el: el, details: details, pre: pre };
}

function buildToolBox(msg, kind, opts) {
  opts = opts || {};
  var el = document.createElement('div');
  el.className = 'msg tool';
  var details = document.createElement('details');
  var open = (opts.mode === 'stream') ? (kind === 'tool_call' || kind === 'tool_result') : false;
  if (kind === 'tool_result' && opts.mode !== 'stream' && /^(📌|🔚|✅ 已持久化|\[exit requested)/.test(msg.content || '')) open = true;
  details.open = open;
  var summary = document.createElement('summary');
  var produced = [el];
  if (kind === 'tool_call') {
    var stepStr = (msg.total && msg.total > 1) ? ' (' + ((msg.index || 0) + 1) + '/' + msg.total + ')' : '';
    var modeTag = msg.mode ? ' [' + msg.mode + ']' : '';
    var nameStr = msg.content || msg.name || 'tool';
    summary.textContent = '🔧 ' + nameStr + stepStr + modeTag + (msg.created_at ? fmtTimeSuffix(msg.created_at) : fmtTimeSuffix());
    details.appendChild(summary);
    var argsArr = [];
    if (msg.toolCalls && msg.toolCalls.length) argsArr = msg.toolCalls;
    else if (msg.args) argsArr = [{ name: msg.name, args: msg.args }];
    argsArr.forEach(function(tc) {
      var argsObj = {};
      try { argsObj = (tc.args && typeof tc.args === 'object') ? tc.args : JSON.parse(tc.args || '{}'); }
      catch(e) { argsObj = { raw: tc.args }; }
      var mdDiv = document.createElement('div');
      mdDiv.className = 'tool-args-md';
      mdDiv.innerHTML = mdToHtml(toolArgsToMarkdown(tc.name, argsObj, msg.file_content || null));
      runMermaid(mdDiv);   // Mermaid 渲染（懒加载）
      details.appendChild(mdDiv);
      if (tc.name === 'pythonrt' && argsObj && typeof argsObj === 'object') {
        var fp = String(argsObj.code_or_filepath || '').trim();
        if (fp.endsWith('.py')) {
          fetch(BASE + 'api/files/download?path=' + encodeURIComponent(fp) + (currentSession ? '&session=' + encodeURIComponent(currentSession) : ''))
            .then(function(r) { return r.ok ? r.text() : null; })
            .then(function(txt) { if (txt) { mdDiv.innerHTML = mdToHtml(toolArgsToMarkdown(tc.name, argsObj, txt)); runMermaid(mdDiv); } })
            .catch(function() {});
        }
      }
    });
    if (opts.mode === 'stream') {
      var progPre = document.createElement('pre');
      progPre.className = 'tool-progress';
      progPre.style.display = 'none';
      details.appendChild(progPre);
      lastToolBoxProgressEl = progPre;
      lastToolCallDetails = details;
    }
  } else if (kind === 'tool_result') {
    var elapsedStr = (msg.elapsed !== undefined) ? ' (' + msg.elapsed.toFixed(2) + 's)' : '';
    var isHist = (msg.exit_code === undefined && msg.stdout === undefined && msg.elapsed === undefined);
    var resLabel = isHist ? '💻 Tool Result' : ('💻 Exit: ' + (msg.exit_code !== undefined ? msg.exit_code : '?'));
    summary.textContent = resLabel + elapsedStr + (msg.created_at ? fmtTimeSuffix(msg.created_at) : fmtTimeSuffix());
    details.appendChild(summary);
    var pre = document.createElement('pre');
    var out = (msg.stdout !== undefined) ? msg.stdout : (msg.content || '(no output)');
    if (msg.stderr) out += '\n[stderr]\n' + msg.stderr;
    if (msg.error) out += '\n[error] ' + msg.error;
    pre.textContent = out;
    details.appendChild(pre);
    if (opts.mode === 'stream') {
      if (lastToolCallDetails) { lastToolCallDetails.open = false; lastToolCallDetails = null; }
      var isTerminal = (msg.name === 'summary' || msg.name === 'exit');
      if (!isTerminal) { lastToolResultDetails = details; }
    }
  } else { // command
    var cmdTag = (msg.kind === 'bang') ? '💻' : '🔧';
    var cmdStatus = (msg.ok === false) ? ' ❌' : ((msg.exit_code !== undefined && msg.exit_code !== null && msg.exit_code !== 0) ? ' (exit=' + msg.exit_code + ')' : '');
    summary.textContent = cmdTag + ' 命令结果' + cmdStatus + (msg.created_at ? fmtTimeSuffix(msg.created_at) : fmtTimeSuffix());
    details.appendChild(summary);
    var pre3 = document.createElement('pre');
    pre3.textContent = msg.result || msg.content || '';
    details.appendChild(pre3);
  }
  el.appendChild(details);
  // summary 正文块（历史 tool_result 的 summary 内容，与实时 summary 正文一致）
  if (kind === 'tool_result' && /^(📌|✅ 已持久化|📄)/.test(msg.content || '')) {
    var historySummary = summaryBodyFromOutput(msg.content);
    if (historySummary) {
      var sbody = document.createElement('div');
      sbody.className = 'msg assistant summary-content';
      var smd = document.createElement('div');
      smd.className = 'md-body';
      smd.innerHTML = mdToHtml(historySummary);
      runMermaid(smd);   // Mermaid 渲染（懒加载）
      linkifyFilePaths(smd);
      sbody.appendChild(smd);
      el.appendChild(sbody);
    }
  }
  return { el: el, details: details, produced: produced };
}

function renderMessage(msg, container) {
  // 单条消息渲染。全量渲染：user/assistant/其他正文 + tool_call/tool_result/command 折叠框
  // （2026-08-05 用户要求历史包含 tool 与命令及其结果）。
  // container 传入时（批量渲染/增量渲染）节点挂到容器（DocumentFragment），
  // 由调用方统一一次性 append 到 #chat；单条渲染时直接 append 并按需滚动。
  // 返回本消息产生的顶层节点数组（user 消息可能产生 meta + el 两个节点），
  // 供渲染复用（数据缓存 + 重建，nodes 已废弃）。
  var dt = msg.displayType || msg.role;
  if (dt === 'tool_call' || dt === 'tool_result' || dt === 'command' || dt === 'thinking') {
    // 历史 tool_call/tool_result/command/thinking → 折叠框渲染（独立结构，不复用流式 appendToolBox）
    var producedTH = renderToolHistory(msg, container || document.getElementById('chat'));
    // 2026-08-23: 折叠框节点补记 _id（DOM 裁剪需从 renderedIds 同步删除）
    if (msg._id) producedTH.forEach(function(n) { if (n && n.dataset) n.dataset.id = msg._id; });
    return producedTH;
  }
  var chat = container || document.getElementById('chat');
  var el;
  var produced = [];
  var afterNodes = [];

  if (dt === 'user') {
    if (msg.timestamp || msg.mode || msg._id) {
      var meta = document.createElement('div');
      meta.className = 'msg-meta-outside';
      if (msg._id) meta.dataset.id = msg._id;
      meta.textContent = (msg.timestamp || '') + (msg.mode ? '  │  ' + msg.mode : '');
      chat.appendChild(meta);
      produced.push(meta);
    }
    el = document.createElement('div');
    el.className = 'msg user';
    var contentDiv = document.createElement('div');
    contentDiv.textContent = msg.content || '';
    el.appendChild(contentDiv);
    if (msg._id) el.dataset.id = msg._id;
    el.dataset.raw = msg.content || '';
    // 2026-08-10: 记录最后 user 消息时间（供 assistant 耗时提示），优先用 DB created_at / 解析的 timestamp
    lastUserMsgTs = msg.created_at || msg.timestamp || lastUserMsgTs;
    appendAnchor(el);   // 修复：历史 user 消息也建锚点（与实时 addMsg('user') 一致）
    // 2026-08-11: 系统信息渲染到 user 消息之后（与实时 addMsg('system') 顺序同构）
    if (msg.sysLines && msg.sysLines.length) {
      msg.sysLines.forEach(function(line) {
        var sysEl = document.createElement('div');
        sysEl.className = 'msg system';   // 2026-08-07: 统一左对齐（基础样式已左对齐）
        sysEl.textContent = line;
        if (msg._id) sysEl.dataset.id = msg._id;
        var t = document.createElement('span');
        t.className = 'msg-time';
        t.textContent = new Date().toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
        sysEl.appendChild(t);
        afterNodes.push(sysEl);
      });
    }

  } else if (dt === 'assistant') {
    // 统一渲染核心：与实时 ensureTextEl 共用 buildAssistantEl（static 模式立即 markdown 渲染）
    el = buildAssistantEl(msg, { mode: 'static' }).el;

  } else if (dt === 'compact') {
    // 2026-09-02: 压缩 marker（手动 /compact 与 autocompactlimit 共用）→ 上下虚线提示块。
    // DB 时序：压缩发生在触发它的用户消息落库之前，故本块渲染在该用户消息上方，
    // 表示"处理这条消息前先自动/手动压缩了上下文"。总结全文已由上一条 assistant
    // 消息渲染，此处默认收起防重复刷屏，点击标题展开/收起。
    el = document.createElement('div');
    el.className = 'msg compact-block collapsed';
    if (msg._id) el.dataset.id = msg._id;
    var chead = document.createElement('div');
    chead.className = 'compact-head';
    chead.textContent = '⚙️ 上下文压缩 · 之前对话已总结归档（点击展开/收起）';
    var cbody = document.createElement('div');
    cbody.className = 'compact-body';
    cbody.textContent = msg.content || '';
    el.appendChild(chead);
    el.appendChild(cbody);
    chead.onclick = function() { el.classList.toggle('collapsed'); };
    if (msg.created_at) {
      var ctime = document.createElement('span');
      ctime.className = 'msg-time';
      ctime.textContent = String(msg.created_at).slice(5, 16);
      chead.appendChild(ctime);
    }

  } else {
    el = document.createElement('div');
    el.className = 'msg ' + (msg.role || '');
    el.textContent = msg.content || '';
    if (msg._id) el.dataset.id = msg._id;
  }

  chat.appendChild(el);
  produced.push(el);
  // 2026-08-15 修复：历史 assistant 带 tool_calls（过渡语正文）→ 正文后补 tool_call 折叠框（与流式顺序一致）
  if (dt === 'assistant' && msg.toolCalls && msg.toolCalls.length) {
    var tcMsg = {
      displayType: 'tool_call',
      content: (msg.toolCalls || []).map(function(tc) { return tc.name; }).join(', '),
      toolCalls: msg.toolCalls,
      created_at: msg.created_at,
    };
    var tcProduced = renderToolHistory(tcMsg, chat);
    produced.push.apply(produced, tcProduced);
  }
  afterNodes.forEach(function(node) { chat.appendChild(node); produced.push(node); });
  if (!container) scrollToBottomIfSticky();
  return produced;
}

// ── 渲染缓存统一（2026-08-15）：数据缓存 + 重建式渲染 ──
// 结构：sessionCache[session] = {lastId, messages, ids, renderedIds, renderedContent}
//   messages        全量消息数据（真源）
//   ids             数据层去重（已拉取的消息 _id）
//   renderedIds     渲染层（应显示在 DOM 的消息 _id：重建时渲染这些；加载更早/增量补充）
//   renderedContent 实时渲染记账（Map<role+content, count>）：实时渲染的无 id 消息，
//                   增量同步时命中则补记 renderedIds 并跳过重复渲染（防流式期间轮询重渲）
// 切回 session → 内存数据全量重建（零网络）；增量 → 追加渲染新消息。
// 不再缓存 DOM 节点（nodes 已废弃），根治 nodes/messages 双账本失同步导致的缓存空洞。

// 渲染 key（与实时 trackRendered 一致：user 提取正文，其余用完整 content）
function renderedKey(m) {
  var content = m.content || '';
  if (m.role === 'user') {
    var m2 = /正文:\n([\s\S]*)$/.exec(content);
    if (m2) content = m2[1];
  }
  return m.role + '\u0001' + content;
}

// 实时 user 气泡初次没有 DB id；收到增量消息后按正文顺序绑定 id，
// 这样新发送的消息也能立即复用同一组 fork/rerun 按钮。
function bindLiveUserMessageId(m) {
  if (!m || m.role !== 'user' || m._id === undefined || m._id === null) return;
  var text = String(m.content || '');
  var nodes = document.querySelectorAll('#chat .msg.user');
  for (var i = 0; i < nodes.length; i++) {
    var node = nodes[i];
    if (node.dataset.id || String(node.dataset.raw || '') !== text) continue;
    var meta = node.previousElementSibling;
    if (!meta || !meta.classList || !meta.classList.contains('msg-meta-outside')) {
      meta = document.createElement('div');
      meta.className = 'msg-meta-outside';
      node.parentNode.insertBefore(meta, node);
    }
    meta.dataset.id = String(m._id);
    return;
  }
}

// 增量合并：freshAll 并入缓存；已实时渲染的（renderedContent 命中）补记 renderedIds
function mergeFresh(c, freshAll) {
  if (!freshAll || !freshAll.length) return;
  freshAll.forEach(function(m) {
    bindLiveUserMessageId(m);
    c.ids.add(m._id);
    var key = renderedKey(m);
    var n = (c.renderedContent && c.renderedContent.get(key)) || 0;
    if (n > 0) {
      c.renderedContent.set(key, n - 1);
      c.renderedIds.add(m._id);   // 实时已渲染 → 补 id，切回重建时包含
    }
  });
  c.messages = c.messages.concat(freshAll);
}

// 数据缓存重建：按 renderedIds 顺序渲染全部应显示消息（切回/首次加载共用）
function renderAllMessages(session, container) {
  var c = sessionCache[session];
  if (!c || !c.messages) return;
  var frag = document.createDocumentFragment();
  // 性能优化（2026-08-22）：只渲染尾部 RENDER_TAIL_COUNT 条（首屏可见范围），
  // 更早的从 renderedIds 裁剪（用户可点"加载更早"补渲染），
  // 避免长期使用后 renderedIds 累积导致切换时全量重建大量 DOM（切换卡顿）。
  var tail = [];
  c.messages.forEach(function(m) {
    if (c.renderedIds.has(m._id)) tail.push(m);
  });
  var keep = tail.slice(-RENDER_TAIL_COUNT);
  var keepIds = new Set(keep.map(function(m) { return m._id; }));
  c.renderedIds = keepIds;   // 裁剪：更早的标记为未渲染（"加载更早"可补）
  keep.forEach(function(m) { renderMessage(m, frag); });
  container.appendChild(frag);
}function trackRendered(role, content) {
  if (!currentSession) return;
  var c = sessionCache[currentSession];
  if (!c) return;
  if (!c.renderedContent) c.renderedContent = new Map();
  var key = role + '\u0001' + (content || '');
  c.renderedContent.set(key, (c.renderedContent.get(key) || 0) + 1);
}


// B: 回合完成 → 静默增量记账（只推进缓存水位，不渲染——实时已渲染）
// B: 回合完成 → 静默增量记账（推进 lastId/ids；实时已渲染的消息补记 renderedIds）
function syncCacheAfterDone(session) {
  var c = sessionCache[session];
  if (!c || !c.ids || c.ids.size === 0) return;
  fetch(BASE + 'api/sessions/' + encodeURIComponent(session) + '/messages?after_id=' + c.lastId)
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (!data || !data.messages || !data.messages.length) return;
      var cur = sessionCache[session];
      if (!cur) return;
      var freshAll = data.messages.filter(function(m) { return !cur.ids.has(m._id); });
      if (freshAll.length) mergeFresh(cur, freshAll);
      cur.lastId = data.last_id || cur.lastId;
    })
    .catch(function() {});
}
// 增量拉取：after_id=lastId → 去重 → 渲染新增消息（正文 + tool/command），数据缓存全部更新
// 增量拉取：after_id=lastId → 数据合并（已实时渲染的补记 renderedIds，真正的新的追加渲染）
function fetchIncremental(session, cached, token, loadingEl, opts) {
  opts = opts || {};
  fetch(BASE + 'api/sessions/' + encodeURIComponent(session) + '/messages?after_id=' + cached.lastId)
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (token !== loadToken) { updateCacheOnly(session, data); return; }  // 已切走：仅更新缓存，不渲染
      renderCrashNotice(session, data.crash_notice);   // 崩溃通知：崩溃自动重启后提示用户
      var freshAll = (data.messages || []).filter(function(m) { return !cached.ids.has(m._id); });
      var toRender = [];
      freshAll.forEach(function(m) {
        bindLiveUserMessageId(m);
        cached.ids.add(m._id);
        var key = renderedKey(m);
        var n = (cached.renderedContent && cached.renderedContent.get(key)) || 0;
        if (n > 0) {
          cached.renderedContent.set(key, n - 1);
          cached.renderedIds.add(m._id);   // 实时已渲染 → 补记，不重复渲染
        } else if (opts.skipRender && m.role !== 'user') {
          // A1 修复（2026-08-22）：切回时 pendingLive 已重放切走期间的消息，
          // DB 增量仅推进水位（补记 renderedIds），不重复渲染 DOM。
          cached.renderedIds.add(m._id);
        } else {
          toRender.push(m);   // 真正新增 → 追加渲染
        }
      });
      if (freshAll.length) cached.messages = cached.messages.concat(freshAll);
      cached.lastId = data.last_id || cached.lastId;
      // 轮询冷却（2026-08-22）：无新消息 → 设置冷却窗口，fetchSessions 轮询跳过，
      // 避免每 2s 重复请求空结果（后端 last_id=0 被 || 短路导致游标不动 → 日志刷屏/浪费请求）。
      if (freshAll.length === 0) {
        cached._noNewUntil = Date.now() + 5000;
      } else {
        cached._noNewUntil = 0;
      }
      var visFresh = toRender.filter(isVisibleMsg);   // 全部渲染（含 tool/command）；skipRender 时 toRender 仅含 user（assistant/tool 已走 skipRender 分支补记不渲染）
      if (loadingEl) loadingEl.textContent = visFresh.length
        ? '✅ 已加载 ' + visFresh.length + ' 条新消息'
        : '✅ 已是最新（' + cached.renderedIds.size + ' 条正文）';
      if (visFresh.length) {
        var frag = document.createDocumentFragment();
        visFresh.forEach(function(m) {
          renderMessage(m, frag);
          cached.renderedIds.add(m._id);
        });
        document.getElementById('chat').appendChild(frag);
      }
      if (data.session) document.getElementById('session-name').textContent = data.session;
      if (loadingEl) loadingEl.remove();   // F9: 移除 loading 提示条（分支1/2 残留）
      // F4c 修订（2026-08-10）：仅在"确实渲染了新消息"时滚底——fetchSessions
      // 2s 轮询会频繁调用本函数（无新消息），无条件滚底会把用户阅读中的历史拉回底部。
      if (visFresh.length && stickToBottom) scrollToBottomIfSticky();
    }).catch(function(err) {
      console.error('incremental load error:', err);
      if (loadingEl) {
        loadingEl.textContent = '⚠️ 增量加载失败（已显示缓存）';
        setTimeout(function() { loadingEl.remove(); }, 2000);
      }
    });
}
// 骨架屏：加载中占位（3 条 shimmer 线条），优于孤立文本提示（用户友好度）
// 崩溃通知横幅：agent 崩溃并自动重启后，在消息区顶部提示用户（含错误与时间）
function renderCrashNotice(session, notice) {
  if (!notice) return;
  var chat = document.getElementById('chat');
  var existing = document.querySelector('.crash-notice[data-session="' + session + '"]');
  if (existing) return;   // 已展示过，不重复
  var el = document.createElement('div');
  el.className = 'crash-notice';
  el.setAttribute('data-session', session);
  var ts = notice.time || '';
  var err = notice.error || 'unknown';
  var txt = document.createElement('span');
  txt.textContent = '⚠️ Agent 崩溃并已自动重启（' + ts + '｜' + err + '）。崩溃期间发送的消息可能丢失，请重发。';
  var ackBtn = document.createElement('button');
  ackBtn.className = 'crash-ack';
  ackBtn.textContent = '知道了';
  ackBtn.onclick = function() {
    fetch(BASE + 'api/sessions/' + encodeURIComponent(session) + '/crash/ack', {method: 'POST'})
      .then(function(r) { return r.json(); })
      .then(function() { if (el.parentNode) el.parentNode.removeChild(el); })
      .catch(function() { if (el.parentNode) el.parentNode.removeChild(el); });
  };
  el.appendChild(txt);
  el.appendChild(ackBtn);
  chat.insertBefore(el, chat.firstChild);
}

function makeLoadingSkeleton() {
  var el = document.createElement('div');
  el.className = 'loading-skeleton';
  el.innerHTML = '<div class="sk-line"></div><div class="sk-line mid"></div><div class="sk-line short"></div>';
  return el;
}

// LRU 缓存写入：超出 MAX_CACHED_SESSIONS 时淘汰最早未使用的 session 缓存。
// 被淘汰的 session 切回时会重新拉取（数据仍在后端），仅释放前端内存，可接受。
function cacheSession(session, entry) {
  delete sessionCache[session];   // 先删后插 → 更新为"最近使用"
  sessionCache[session] = entry;
  var keys = Object.keys(sessionCache);
  while (keys.length > MAX_CACHED_SESSIONS) {
    var victim = keys.shift();
    delete sessionCache[victim];
  }
}

function loadSessionMessages(session, opts) {
  // 方案A++（2026-08-15 统一）：per-session 数据缓存 + 重建式渲染。
  // - 缓存只存数据（messages/ids/renderedIds/renderedContent），不存 DOM 节点（nodes 已废弃）
  // - 切回缓存命中 → 内存数据全量重建（零网络）；增量 → 追加渲染新消息
  // - loadToken 防竞态：切走/切回并发时，仅当前会话的响应允许渲染 DOM
  // - opts.preserveView=true（P0 重连路径）：不清空现有 DOM、不强制滚底，仅增量补新
  opts = opts || {};
  var cached = sessionCache[session];
  if (opts.preserveView && cached && cached.ids && cached.ids.size) {
    // ── 重连 + 已有缓存：保留视图，仅增量拉取补新（不清空、不滚底）──
    var lEl = makeLoadingSkeleton();
    document.getElementById('chat').appendChild(lEl);
    fetchIncremental(session, cached, ++loadToken, lEl);
    return;
  }
  clearChat();
  stickToBottom = true;   // 加载历史后强制滚底显示最新消息
  var token = ++loadToken;
  var loadingEl = makeLoadingSkeleton();
  document.getElementById('chat').appendChild(loadingEl);
  ensureOlderButton();   // 顶部"加载更早"按钮（先于消息插入）

  if (cached && cached.messages && cached.messages.length) {
    // ── 分支1：数据缓存命中 → 内存全量重建（零网络）+ 补出未渲染新消息 + 增量拉新 ──
    renderAllMessages(session, document.getElementById('chat'));
    // 修复（2026-08-23）：切回重建（clearChat）已清空 DOM，实时渲染记账（renderedContent）失效。
    // 用户消息实时发送时只记账 renderedContent、未入 renderedIds；若不清理，fetchIncremental
    // 拉取用户消息时 n>0 走"实时已渲染→补记不渲染"分支 → 用户消息永久丢失。清空后 n=0 走正常渲染。
    if (cached.renderedContent) cached.renderedContent.clear();
    // C1（2026-08-21）：切回重放后台缓冲的实时事件（thinking/text/tool/done）。
    // 后台回合未结束时不落库，DB 增量拉不到；pendingLive 是唯一数据源。
    // 重放顺序与实时一致：thinking → thinking_content → text → tool_call → ... → done
    var hadPendingLive = !!(cached.pendingLive && cached.pendingLive.length);
    replayPendingLive(session);
    // C1+（2026-08-22）：重放已渲染切走期间的新消息 → 补记 renderedIds，
    // 防止下方 gapNew / fetchIncremental 重复渲染同一批内容。
    if (hadPendingLive) markNewRendered(session);
    // 切走期间被轮询/记账拉入但未渲染的新消息（id > 已渲染最大 id）→ 追加渲染到末尾。
    // 不能用 renderOlderBatch（它只负责"更早历史"插顶部，新消息走这里才是实时位置）。
    var maxRendered = -1;
    cached.renderedIds.forEach(function(id) { if (id > maxRendered) maxRendered = id; });
    var gapNew = cached.messages.filter(function(m) {
      return isVisibleMsg(m) && !cached.renderedIds.has(m._id) && m._id > maxRendered;
    });
    if (gapNew.length) {
      var gapFrag = document.createDocumentFragment();
      gapNew.forEach(function(m) {
        renderMessage(m, gapFrag);
        cached.renderedIds.add(m._id);
      });
      document.getElementById('chat').appendChild(gapFrag);
    }
    // 更早历史不自动补渲染（renderAllMessages 已裁剪为尾部 RENDER_TAIL_COUNT 条）：
    // 用户点"加载更早"按钮时由 renderOlderBatch 补渲染，避免每次切换全量重建。
    updateOlderButton();
    forceScrollToBottom();   // F4c: 节点插入后立即滚底（同步+rAF 双保险）
    // A1 修复（2026-08-22）：pendingLive 重放已覆盖切走期间消息 → 增量仅推进水位防重复渲染
    fetchIncremental(session, cached, token, loadingEl, hadPendingLive ? {skipRender: true} : undefined);
  } else {
    // ── 分支2：无缓存 → 分页全量拉取（limit=100）→ 初始化缓存 + 渲染尾部 ──
    fetch(BASE + 'api/sessions/' + encodeURIComponent(session) + '/messages?limit=100').then(function(r) { return r.json(); }).then(function(data) {
      if (token !== loadToken) { updateCacheOnly(session, data); return; }  // 已切走：仅更新缓存，不渲染
      renderCrashNotice(session, data.crash_notice);   // 崩溃通知：崩溃自动重启后提示用户
      var msgs = data.messages || [];
      var renderedIds = new Set();
      var tail = lastVisibleTail(msgs, RENDER_TAIL_COUNT);
      tail.forEach(function(m) { renderedIds.add(m._id); });
      // T5: 记录后端 total/hasMore 与最老真实 id（"加载更早"后端分页游标）
      var oldestReal = 0;
      for (var oi = 0; oi < msgs.length; oi++) {
        if (typeof msgs[oi]._id === 'number') { oldestReal = msgs[oi]._id; break; }
      }
      var freshCacheEntry = {
        lastId: data.last_id || 0,
        messages: msgs.slice(),
        ids: new Set(msgs.map(function(m) { return m._id; })),
        renderedIds: renderedIds,
        renderedContent: new Map(),
        total: data.total !== undefined ? data.total : msgs.length,
        hasMore: data.has_more !== undefined ? data.has_more : false,
        oldestId: oldestReal,
        pendingLive: [],   // C1: 后台实时事件缓冲（切回重放）
      };
      // C1: 若后台事件已先到（ensurePendingLive 创建了缓存），合并缓冲
      if (sessionCache[session] && sessionCache[session].pendingLive) {
        freshCacheEntry.pendingLive = sessionCache[session].pendingLive;
      }
      cacheSession(session, freshCacheEntry);
      renderAllMessages(session, document.getElementById('chat'));
      // C1: 无缓存首次加载也可能有后台事件（后台先于首次加载到达）→ 重放
      replayPendingLive(session);
      if (data.session) document.getElementById('session-name').textContent = data.session;
      // P1: 展示总数与已渲染条数（后端 total 字段）——用户友好度
      if (data.total !== undefined) {
        loadingEl.textContent = '✅ 共 ' + data.total + ' 条消息，已显示最新 ' + tail.length + ' 条';
      } else {
        loadingEl.textContent = '✅ 已渲染最新 ' + tail.length + ' 条';
      }
      updateOlderButton();
      loadingEl.remove();   // F4d: 先移除 loading 条，消除 scrollHeight 计算干扰
      forceScrollToBottom();   // F4c: 历史加载完成 → 强制滚底（同步+rAF 双保险）
      fetchIncremental(session, sessionCache[session], token, loadingEl);
    }).catch(function(err) {
      console.error('loadSessionMessages error:', err);
      if (loadingEl) loadingEl.remove();
      // 降级（2026-08-22）：瞬时网络抖动/后端重启不应弹红色错误横幅。
      // 首次失败：轻量提示 + 自动重试一次；仍失败则显示错误 + 重试按钮。
      var retries = sessionRetryCount[session] || 0;
      if (retries < 1) {
        sessionRetryCount[session] = retries + 1;
        var infoMsg = addMsg('info', '⚠️ 加载会话消息失败，正在重试…');
        setTimeout(function() {
          if (infoMsg && infoMsg.parentNode) infoMsg.parentNode.removeChild(infoMsg);
          loadSessionMessages(session);
        }, 1500);
      } else {
        sessionRetryCount[session] = 0;
        var errMsg = addMsg('error', '❌ 加载会话消息失败 ');
      var retryBtn = document.createElement('button');
      retryBtn.textContent = '重试';
      retryBtn.style.cssText = 'margin-left:6px;padding:1px 10px;border:none;border-radius:8px;background:#fff;color:#dc2626;cursor:pointer;font-size:11px;';
      retryBtn.onclick = function() { loadSessionMessages(session); };
      errMsg.appendChild(retryBtn);
      }
    });
  }
}
// 点击"加载更早"：补渲染紧邻已渲染区间的更早 RENDER_TAIL_COUNT 条正文，
// 插入到消息顶部并保持滚动视口位置（不跳动）
// 点击"加载更早"：补渲染紧邻已渲染区间的更早 RENDER_TAIL_COUNT 条正文，
// 插入到消息顶部并保持滚动视口位置（不跳动）
// 渲染一批更早消息到顶部并保持视口（缓存内批次 / 后端分页批次共用）
function renderBatchToTop(frag, chat, btn, distToBottom, anchorsStart) {
  chat.insertBefore(frag, btn.nextSibling);
  var anchors = document.getElementById('msg-anchors');
  if (anchors) {
    var newDots = [];
    for (var ai = 0; ai < anchors.children.length; ai++) {
      var ad = anchors.children[ai];
      if (ad.classList && ad.classList.contains('anchor-dot') && ad.dataset.idx !== undefined && parseInt(ad.dataset.idx, 10) >= anchorsStart) {
        newDots.push(ad);
      }
    }
    if (newDots.length) {
      newDots.forEach(function(d) { anchors.removeChild(d); });
      var ref = anchors.firstChild;
      if (ref) {
        newDots.forEach(function(d) { anchors.insertBefore(d, ref); });
      } else {
        newDots.forEach(function(d) { anchors.appendChild(d); });
      }
    }
  }
  chat.scrollTop = chat.scrollHeight - distToBottom;
}

function renderOlderBatch(session) {
  var cached = sessionCache[session];
  if (!cached || !cached.messages) return;
  // 只处理"更早于已渲染区间"的历史消息。
  // 切走期间产生的新消息（id 更大、未渲染）不属于"更早历史"，
  // 由 loadSessionMessages 分支1 的 gapNew 追加渲染到消息区末尾（实时位置），
  // 否则会被误插到顶部（历史位置）→ 顺序错乱（历史渲染到实时消息下面）。
  var minRendered = Infinity;
  cached.renderedIds.forEach(function(id) { if (id < minRendered) minRendered = id; });
  // 缓存内还有未渲染 → 直接渲染紧邻已渲染区间的上一批（原逻辑）
  var unrendered = cached.messages.filter(function(m) {
    return isVisibleMsg(m) && !cached.renderedIds.has(m._id) && m._id < minRendered;
  });
  if (unrendered.length) {
    var batch = unrendered.slice(-RENDER_TAIL_COUNT);
    var frag = document.createDocumentFragment();
    var anchorsStart = anchorCounter;
    batch.forEach(function(m) {
      renderMessage(m, frag);
      cached.renderedIds.add(m._id);
    });
    var chat = document.getElementById('chat');
    var btn = ensureOlderButton();
    var distToBottom = chat.scrollHeight - chat.scrollTop;
    renderBatchToTop(frag, chat, btn, distToBottom, anchorsStart);
    updateOlderButton();
    return;
  }
  // 缓存耗尽 → 后端向前分页拉取更早消息（不受 compact cutoff 限制，完整历史可达）
  if (!cached.hasMore) { updateOlderButton(); return; }
  // 并发锁：加载期间禁止重复触发（防双击产生重复请求/状态错乱）
  if (cached._loadingOlder) return;
  var oldestId = cached.oldestId || 0;
  if (!oldestId) { updateOlderButton(); return; }   // 无游标（异常缓存）→ 兜底不请求
  cached._loadingOlder = true;
  var btn2 = ensureOlderButton();
  btn2.textContent = '⏳ 正在加载更早的消息...';
  fetch(BASE + 'api/sessions/' + encodeURIComponent(session) + '/messages?before_id=' + oldestId + '&limit=' + RENDER_TAIL_COUNT)
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var cur = sessionCache[session];
      if (cur) cur._loadingOlder = false;
      if (!cur || !data || !data.messages || !data.messages.length) {
        if (cur) cur.hasMore = false;   // 后端确认无更早
        updateOlderButton();
        return;
      }
      var fresh = data.messages.filter(function(m) { return !cur.ids.has(m._id); });
      if (!fresh.length) {
        // 本批全在缓存（并发/重复请求）→ 用后端 has_more 更新（不误置 false）
        if (data.has_more !== undefined) cur.hasMore = data.has_more;
        updateOlderButton();
        return;
      }
      // 更早批次并入缓存头部（旧→新保持）
      cur.messages = fresh.concat(cur.messages);
      fresh.forEach(function(m) { cur.ids.add(m._id); });
      cur.hasMore = data.has_more !== undefined ? data.has_more : false;
      if (data.oldest_id) cur.oldestId = data.oldest_id;
      var frag = document.createDocumentFragment();
      var anchorsStart = anchorCounter;
      fresh.forEach(function(m) {
        renderMessage(m, frag);
        cur.renderedIds.add(m._id);
      });
      var chat = document.getElementById('chat');
      var btn3 = ensureOlderButton();
      var distToBottom = chat.scrollHeight - chat.scrollTop;
      renderBatchToTop(frag, chat, btn3, distToBottom, anchorsStart);
      updateOlderButton();
    })
    .catch(function() {
      var cur2 = sessionCache[session];
      if (cur2) cur2._loadingOlder = false;
      var btn4 = document.getElementById('older-btn');
      if (btn4) btn4.textContent = '⚠️ 加载更早失败，点击重试';
    });
}
// 竞态兜底：请求返回时已切到其他 session → 只更新数据缓存不渲染 DOM，
// 避免旧会话消息污染当前视图；下次切回直接命中缓存（按 _id 去重）
// 竞态兜底：请求返回时已切到其他 session → 只更新数据缓存不渲染 DOM，
// 避免旧会话消息污染当前视图；下次切回直接命中缓存（按 _id 去重）
function updateCacheOnly(session, data) {
  if (!data || !data.messages) return;
  var c = sessionCache[session];
  if (!c) {
    var nOldest = 0;
    for (var ni = 0; ni < data.messages.length; ni++) {
      if (typeof data.messages[ni]._id === 'number') { nOldest = data.messages[ni]._id; break; }
    }
    c = {
      lastId: data.last_id || 0,
      messages: data.messages.slice(),
      ids: new Set(data.messages.map(function(m) { return m._id; })),
      renderedIds: new Set(),
      renderedContent: new Map(),
      oldestId: nOldest,
    };
    sessionCache[session] = c;
  }
  var freshAll = data.messages.filter(function(m) { return !c.ids.has(m._id); });
  if (freshAll.length) mergeFresh(c, freshAll);
  c.lastId = data.last_id || c.lastId;
  // 全量路径才带 total/hasMore（增量路径无 → 保持原值，防污染总数）
  if (data.total !== undefined) c.total = data.total;
  if (data.has_more !== undefined) c.hasMore = data.has_more;
}
function updateLockTag(data) {
  const observing = data && data.observing;
  if (observing) {
    // T7: 观察者模式 → 显示 ⏳ 持有者（对齐 repl 的 [⏳pid:tid]）
    const holder = data.holder || {};
    const name = holder.holder || holder.holder_name || '未知进程';
    curLockMsg = '⏳ ' + name;
  } else {
    curLockMsg = null;
  }
  updateLockIndicator();
}

function openModelTestModal() {
  // 关闭已存在的弹窗
  closeModelTestModal();
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'model-test-overlay';
  overlay.innerHTML =
    '<div class="modal-box">' +
    '  <div class="modal-head"><span class="modal-title">⚡ 模型联通性测试</span>' +
    '    <button class="modal-close" onclick="closeModelTestModal()">✕</button></div>' +
    '  <div class="modal-body"><div id="model-test-content" style="color:var(--text-muted,#888)">⏳ 测试中（每个模型约需数秒）...</div></div>' +
    '</div>';
  overlay.addEventListener('click', function(e) { if (e.target === overlay) closeModelTestModal(); });
  document.body.appendChild(overlay);
  fetch(BASE + 'api/model/test' + (currentSession ? '?session=' + encodeURIComponent(currentSession) : ''), {method: 'POST'}).then(function(r) { return r.json(); }).then(function(data) {
    var content = document.getElementById('model-test-content');
    if (!content) return;
    if (!data.ok) { content.textContent = '❌ 测试失败: ' + (data.error || 'unknown'); return; }
    var results = data.results || [];
    // 排序：成功项按延迟从小到大（升序），失败项排最后（保持原顺序）
    var okList = results.filter(function(r) { return r.ok; })
      .sort(function(a, b) { return (a.latency_ms || 0) - (b.latency_ms || 0); });
    var failList = results.filter(function(r) { return !r.ok; });
    var ordered = okList.concat(failList);
    var okN = okList.length;
    var html = '<table class="model-test-table"><tr><th>Provider.Model</th><th>状态</th><th>延迟</th></tr>';
    ordered.forEach(function(r) {
      var name = (r.provider || '?') + '.' + (r.model || '?');
      var status = r.ok
        ? '<span class="mt-ok">✅</span>'
        : '<span class="mt-fail">❌ ' + escapeHtml(String(r.error || 'failed').slice(0, 40)) + '</span>';
      var lat = r.ok ? (r.latency_ms + 'ms') : '-';
      html += '<tr><td>' + escapeHtml(name) + '</td><td>' + status + '</td><td>' + lat + '</td></tr>';
    });
    html += '</table><div style="margin-top:8px;font-size:12px;color:var(--text-muted,#888)">' +
      okN + '/' + results.length + ' 可用，总耗时 ' + (data.elapsed || 0).toFixed(1) + 's</div>';
    content.innerHTML = html;
  }).catch(function(err) {
    var content = document.getElementById('model-test-content');
    if (content) content.textContent = '❌ 请求失败: ' + err;
  });
}

function closeModelTestModal() {
  var overlay = document.getElementById('model-test-overlay');
  if (overlay) overlay.remove();
}

function setSessionModel(provider, model, scope, cb) {
  var body = {model: model, scope: scope};
  if (provider) body.provider = provider;
  fetch(BASE + 'api/model/set', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  }).then(function(r) { return r.json(); }).then(function(data) {
    var msg = data.ok
      ? (scope === 'current'
          ? '✅ 当前 session 已设为 ' + (provider ? provider + ' · ' : '') + model
          : '✅ 已设置 ' + data.ok_count + '/' + data.total + ' 个 session')
      : '❌ 设置失败: ' + (data.error || 'unknown');
    alert(msg);
    if (data.ok) {
      closeModelTestModal();
      fetchStatus();      // 刷新顶部 provider-model 显示
      fetchSessions();    // 刷新 session 列表（模式/状态可能变化）
    }
    if (cb) cb(!!data.ok);
  }).catch(function(err) { alert('❌ 请求失败: ' + err); if (cb) cb(false); });
}

var modelOptionsLoaded = false;
function loadModelList() {
  if (modelOptionsLoaded) return;   // config 静态，只加载一次
  fetch(BASE + 'api/model/list').then(function(r) { return r.json(); }).then(function(data) {
    if (!data.ok || !data.models) return;
    modelOptionsLoaded = true;
    var sel = document.getElementById('provider-model-select');
    if (!sel) return;
    var html = '';
    data.models.forEach(function(m) {
      var label = (m.provider || '?') + ' · ' + (m.model || '?');
      var val = (m.provider || '') + '|' + (m.model || '');
      html += '<option value="' + escapeHtml(val) + '">' + escapeHtml(label) + '</option>';
    });
    sel.innerHTML = html;
    if (data.current) syncModelSelect(data.current.provider, data.current.model);
  }).catch(function() {});
}

function syncModelSelect(provider, model) {
  var sel = document.getElementById('provider-model-select');
  if (!sel || !sel.options.length) return;
  var prov = String(provider || '').trim();
  var mdl = String(model || '').trim();
  if (!mdl) return;
  var pure = mdl.split(':')[0];   // 剥离 :effort 后缀（选项为纯模型名）
  for (var i = 0; i < sel.options.length; i++) {
    var parts = sel.options[i].value.split('|');
    var oProv = parts[0] || '', oModel = parts[1] || '';
    if (oModel === pure && (!prov || !oProv || oProv === prov)) {
      sel.value = sel.options[i].value;
      return;
    }
  }
  // config 变更后当前模型不在列表：临时追加一项兜底显示
  var opt = document.createElement('option');
  opt.value = prov + '|' + mdl;
  opt.textContent = (prov || '?') + ' · ' + mdl;
  sel.appendChild(opt);
  sel.value = opt.value;
}

function onModelSelectChange() {
  var sel = document.getElementById('provider-model-select');
  if (!sel) return;
  var oldVal = sel.dataset.prevValue || '';
  var v = sel.value;
  sel.dataset.prevValue = v;
  if (!v || v === oldVal) return;   // 未变化或首次加载不触发
  var parts = v.split('|');
  var provider = parts[0] || null;
  var model = parts[1] || '';
  setSessionModel(provider, model, 'current', function(ok) {
    if (!ok) sel.value = oldVal;   // 切换失败回滚选中态
  });
}

function formatClockTs(ts) {
  // 解析 DB created_at "YYYY-MM-DD HH:MM:SS" → HH:MM
  if (!ts) return '';
  var d = new Date(ts);
  if (isNaN(d.getTime())) return '';
  return d.toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'});
}

function fmtTimeSuffix(ts) {
  // 折叠框 summary 时间后缀：有 created_at 用真实消息时间，否则用本地当前时间（与实时路径一致）
  var t = formatClockTs(ts) || new Date().toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
  return t ? '  ' + t : '';
}

function formatLatency(userTs, msgTs) {
  // 计算 msgTs 距 userTs 的 X分Y秒
  if (!userTs || !msgTs) return '';
  var u = new Date(userTs), m = new Date(msgTs);
  if (isNaN(u.getTime()) || isNaN(m.getTime())) return '';
  var diff = Math.max(0, (m.getTime() - u.getTime()) / 1000);
  if (diff < 1) return '';
  var min = Math.floor(diff / 60), sec = Math.floor(diff % 60);
  return (min > 0 ? min + ' 分 ' : '') + sec + ' 秒';
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function fetchStatus() {
  var q = currentSession ? ('?session=' + encodeURIComponent(currentSession)) : '';
  return fetch(BASE + 'api/session/stats' + q).then(r => r.json()).then(data => {
    // P0 防御：响应 session 与前端当前 session 不一致（切换竞态/缓存残留）时不覆盖标题与 currentSession
    if (currentSession && data.session && data.session !== currentSession) {
      return;
    }
    currentWorkdir = data.workdir || '';   // 路径链接：项目根
    document.getElementById('session-name').textContent = data.session || '-';
    setMode(data.mode);
    updateLockTag(data);   // T9: 初始化/轮询渲染锁标签
    updateStatsFrom(data, false); // 3: 初始加载不显示累计值（token 仅由 WS stats 单轮值驱动）
    currentSession = data.session;
  });
}

function updateStatsFrom(data, showTokens) {
  // v2 方案A(完善)：token 区优先由 WS stats 事件(当前轮单轮值)驱动；
  // showTokens=false(fetchStatus/updateStats 的会话累计值)时：
  //   - 已收到过当前轮 stats(hasWsStats=true) -> 不覆盖(保持当前轮显示, done 后一致)
  //   - 未收到(刚进入 session) -> 显示 db 持久化的最近一轮单轮值 last_*("上一轮")
  // 累计值 prompt_tokens/completion_tokens 始终不用于显示(避免大太多)。
  const el = document.getElementById('token-stats');
  if (showTokens !== false) {
    const total = (data.prompt_tokens || 0) + (data.completion_tokens || 0);
    const rt = data.reasoning_tokens || 0;
    if (el) {
      if (rt > 0) {
        el.textContent = '📊 ' + total.toLocaleString() + ' tokens (🧠思考 ' + rt.toLocaleString() + ')';
      } else {
        el.textContent = '📊 ' + total.toLocaleString() + ' tokens';
      }
    }
  } else if (!hasWsStats) {
    const lastTotal = (data.last_prompt_tokens || 0) + (data.last_completion_tokens || 0);
    if (lastTotal > 0 && el) el.textContent = '📊 上轮 ' + lastTotal.toLocaleString() + ' tokens';
    // A2 修复（2026-08-22）：新 session 无历史 → 清空，防止残留上一个 session 的 token 值
    else if (el && el.textContent) el.textContent = '';
  }
  updateProviderModel(data);
}
function updateProviderModel(data) {
  const el = document.getElementById('provider-model-select');
  if (!el) return;
  const hasP = data.provider !== undefined && data.provider !== null;
  const hasM = data.model !== undefined && data.model !== null;
  if (!hasP && !hasM) return;  // ws stats 事件无此字段，保持现状不覆盖
  const prov = hasP ? String(data.provider).trim() : '';
  const model = hasM ? String(data.model).trim() : '';
  if (prov || model) syncModelSelect(prov, model);
}
function updateStats() {
  var q = currentSession ? ('?session=' + encodeURIComponent(currentSession)) : '';
  fetch(BASE + 'api/session/stats' + q).then(r => r.json()).then(data => updateStatsFrom(data, false)).catch(function(){});
}

// ── 2026-08-28: 按消息 fork / rerun（复用 meta 行；Observer 自动挂按钮 + 委托点击）──
(function() {
  var chat = document.getElementById('chat');
  if (!chat) return;
  function ensureMsgFork(meta) {
    if (!meta || !meta.dataset.id) return;
    if (!meta.querySelector('.msg-fork')) {
      var forkBtn = document.createElement('button');
      forkBtn.className = 'msg-fork';
      forkBtn.type = 'button';
      forkBtn.textContent = '⧉';
      forkBtn.title = '从此消息 fork 新会话（含该消息及上方历史）';
      forkBtn.dataset.msgId = meta.dataset.id;
      meta.appendChild(forkBtn);
    }
    if (!meta.querySelector('.msg-rerun')) {
      var rerunBtn = document.createElement('button');
      rerunBtn.className = 'msg-rerun';
      rerunBtn.type = 'button';
      rerunBtn.textContent = '↻';
      rerunBtn.title = '从此消息重新生成（删除该消息及其后的历史）';
      rerunBtn.dataset.msgId = meta.dataset.id;
      meta.appendChild(rerunBtn);
    }
  }
  var mo = new MutationObserver(function(muts) {
    muts.forEach(function(m) {
      m.addedNodes.forEach(function(n) {
        if (n.nodeType !== 1) return;
        if (n.classList && n.classList.contains('msg-meta-outside')) ensureMsgFork(n);
        if (n.querySelectorAll) n.querySelectorAll('.msg-meta-outside').forEach(ensureMsgFork);
      });
    });
  });
  mo.observe(chat, {childList: true, subtree: true});
  chat.querySelectorAll('.msg-meta-outside').forEach(ensureMsgFork);
  chat.addEventListener('click', function(e) {
    var btn = e.target.closest ? e.target.closest('.msg-fork, .msg-rerun') : null;
    if (!btn) return;
    e.stopPropagation();

    if (btn.classList.contains('msg-rerun')) {
      if (rerunInFlight) return;
      var session = currentSession;
      var messageId = Number(btn.dataset.msgId);
      if (!session || !Number.isInteger(messageId) || messageId <= 0) {
        alert('刷新失败：无效的 session 或消息 id');
        return;
      }
      if (isStreaming) {
        alert('当前 session 正在处理，请等待本轮结束后再刷新');
        return;
      }
      if (!confirm('将删除此消息及其后的全部对话历史，并从此消息重新生成，确定继续吗？')) return;
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        alert('刷新失败：WebSocket 未连接，请稍后重试');
        connect();
        return;
      }
      rerunInFlight = true;
      isStreaming = true;
      setStopBtnVisible(true);
      try {
        ws.send(JSON.stringify({type: 'rerun', session: session, message_id: messageId}));
      } catch (err) {
        rerunInFlight = false;
        isStreaming = false;
        setStopBtnVisible(false);
        alert('刷新失败：' + err.message);
      }
      return;
    }

    var target = prompt('复制会话 "' + currentSession + '" 为新会话名:', currentSession + '_cut');
    if (!target) return;
    fetch(BASE + 'api/sessions/' + encodeURIComponent(currentSession) + '/fork', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({target: target, cutoff: btn.dataset.msgId})
    })
      .then(function(r) { return r.json().then(function(d) { return {ok: r.ok, data: d}; }); })
      .then(function(res) {
        if (!res.ok) { alert('Fork 失败: ' + ((res.data && res.data.detail) || res.status)); return; }
        fetchSessions();
      })
      .catch(function(e) { alert('Fork 失败: ' + e.message); });
  });
})();

// ── 2026-09-11: 侧边栏宽度拖拽（拖动右缘调宽；localStorage 记忆；双击恢复默认）──
(function initSidebarResizer() {
  var DEFAULT_W = 320, MIN_W = 220, MAX_W = 640, KEY = 'sidebarWidth';
  // 恢复逻辑已提前到 <body> 开头的早置脚本（防首帧闪跳），此处不再重复
  var rz = document.getElementById('sidebar-resizer');
  var sidebar = document.getElementById('sidebar');
  if (!rz || !sidebar) return;
  var dragging = false, startX = 0, startW = 0;
  var _lastDownTs = 0;
  rz.addEventListener('pointerdown', function (e) {
    if (window.innerWidth <= 768) return;   // 移动端（overlay 侧栏）不启用拖拽
    // 双击检测自实现（2026-09-11 review）：pointerdown 的 preventDefault 可能抑制
    // 兼容鼠标事件序列（dblclick 未必触发），改用时间戳判定，行为确定。
    var _now = Date.now();
    if (_now - _lastDownTs < 400) {
      _lastDownTs = 0;
      document.documentElement.style.setProperty('--sidebar-w', DEFAULT_W + 'px');
      try { localStorage.setItem(KEY, String(DEFAULT_W)); } catch (e2) {}
      return;   // 双击：重置宽度，不进入拖拽
    }
    _lastDownTs = _now;
    dragging = true; startX = e.clientX;
    startW = sidebar.getBoundingClientRect().width;
    rz.classList.add('dragging');
    document.body.classList.add('sidebar-resizing');
    e.preventDefault();
  });
  // 2026-09-11 review: move/up 改挂 document 级——指针移出把手范围 / 窗口外松开 / 捕获失败
  // 也能正确收尾，避免 dragging 卡死；e.buttons==0 兜底补一次 endDrag。
  document.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    if (e.buttons === 0) { endDrag(); return; }
    var w = Math.round(startW + (e.clientX - startX));
    w = Math.max(MIN_W, Math.min(MAX_W, w));
    document.documentElement.style.setProperty('--sidebar-w', w + 'px');
  });
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    rz.classList.remove('dragging');
    document.body.classList.remove('sidebar-resizing');
    try { localStorage.setItem(KEY, String(Math.round(sidebar.getBoundingClientRect().width))); } catch (e) {}
  }
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', endDrag);
  // 双击重置：见 pointerdown 内的自实现检测（不依赖 dblclick 兼容事件）
})();
</script>
