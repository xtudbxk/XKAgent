<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XKAgent - Login</title>
<style>
  :root {
    --bg: #f3f5fb;
    --surface: #ffffff;
    --surface2: #f6f6f6;
    --accent: #0066ff;
    --accent-hover: #0052cc;
    --text: #1c1f23;
    --text-muted: #57606a;
    --border: rgba(28, 31, 35, 0.08);
    --radius: 12px;
    --err: #dc2626;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 40px;
    width: 360px;
    box-shadow: 0 4px 24px rgba(28, 31, 35, 0.08);
  }
  h1 { font-size: 22px; margin-bottom: 8px; color: var(--accent); }
  p.sub { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }
  label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 4px; }
  input {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 14px; margin-bottom: 16px;
    background: var(--surface2);
  }
  button {
    width: 100%; padding: 12px; background: var(--accent); color: #fff;
    border: none; border-radius: 8px; font-size: 15px; cursor: pointer;
    transition: background .15s;
  }
  button:hover { background: var(--accent-hover); }
  #error-msg { color: var(--err); font-size: 13px; margin-top: 12px; display: none; }
  #loading-msg { color: var(--text-muted); font-size: 13px; margin-top: 12px; display: none; }
</style>
</head>
<body>
<div class="card">
  <h1>XKAgent</h1>
  <p class="sub">Sign in to continue</p>
  <label for="username">Username</label>
  <input type="text" id="username" autocomplete="username">
  <label for="password">Password</label>
  <input type="password" id="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
  <button onclick="doLogin()">Sign In</button>
  <div id="error-msg">Invalid username or password</div>
  <div id="loading-msg">Signing in...</div>
</div>
<script>
const BASE = (function(){ var p = location.pathname; return p.endsWith('/') ? p : p.substring(0, p.lastIndexOf('/') + 1); })();
async function doLogin() {
  const user = document.getElementById('username').value.trim();
  const pw = document.getElementById('password').value;
  if (!user || !pw) return;
  document.getElementById('error-msg').style.display = 'none';
  document.getElementById('loading-msg').style.display = 'block';
  try {
    const resp = await fetch(BASE + 'api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: user, password: pw})
    });
    if (resp.ok) {
      // 支持 ?next= 跳回原页面（401 自动跳转带参），默认回根路径
      var next = new URLSearchParams(location.search).get('next');
      window.location.href = (next && next.indexOf('/') === 0) ? next : BASE;
    } else {
      document.getElementById('error-msg').style.display = 'block';
    }
  } catch(e) {
    document.getElementById('error-msg').style.display = 'block';
  }
  document.getElementById('loading-msg').style.display = 'none';
}
</script>
</body>
</html>
